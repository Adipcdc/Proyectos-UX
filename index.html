<title>Viáticos UX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EDEFF3;
  --surface-3:#E3E6EC;
  --text:#1A1E27;
  --text-muted:#5C6472;
  --text-faint:#8C93A0;
  --border:#DCE0E6;
  --accent:#C97A22;
  --accent-strong:#A8631A;
  --accent-ink:#FFF7EC;
  --accent-soft:#FBEBD9;
  --blue:#2E5F8A;
  --blue-soft:#E4EDF5;
  --good:#2C8A5B;
  --good-soft:#E2F3E9;
  --bad:#C24B3E;
  --bad-soft:#FBE7E4;
  --shadow: 0 1px 2px rgba(20,24,32,.06), 0 6px 16px -8px rgba(20,24,32,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161B;
    --surface:#1C1F26;
    --surface-2:#242832;
    --surface-3:#2C303C;
    --text:#EAECF0;
    --text-muted:#9BA2B0;
    --text-faint:#6E7583;
    --border:#2E323D;
    --accent:#E0A354;
    --accent-strong:#EDB66C;
    --accent-ink:#231705;
    --accent-soft:#3A2A14;
    --blue:#7FA9CE;
    --blue-soft:#1E2C3A;
    --good:#5FBE8B;
    --good-soft:#173225;
    --bad:#E28174;
    --bad-soft:#3A2019;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B;
  --surface:#1C1F26;
  --surface-2:#242832;
  --surface-3:#2C303C;
  --text:#EAECF0;
  --text-muted:#9BA2B0;
  --text-faint:#6E7583;
  --border:#2E323D;
  --accent:#E0A354;
  --accent-strong:#EDB66C;
  --accent-ink:#231705;
  --accent-soft:#3A2A14;
  --blue:#7FA9CE;
  --blue-soft:#1E2C3A;
  --good:#5FBE8B;
  --good-soft:#173225;
  --bad:#E28174;
  --bad-soft:#3A2019;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
h1,h2,h3{ text-wrap:balance; margin:0; }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; }

#app{
  max-width:520px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding-inline:16px;
}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:20;
  background:var(--bg);
  padding-block:14px 8px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid transparent;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.brand .wordmark{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.01em;
}
.brand .wordmark .accent-dot{ color:var(--accent); }
.brand .sub{
  font-size:11.5px;
  color:var(--text-muted);
}
.sync-pill{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--text-muted);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 10px 5px 8px;
  white-space:nowrap;
}
.sync-dot{ width:7px;height:7px;border-radius:50%; background:var(--good); flex:none; }
.sync-dot.local{ background:var(--text-faint); }

/* ---------- Project chips ---------- */
.chips-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-block:6px 12px;
  scrollbar-width:none;
}
.chips-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 13px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
}
.dot{ width:6px;height:6px;border-radius:50%; flex:none; display:inline-block; }
.chip.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--text);
}
.chip.add{
  color:var(--accent);
  border-style:dashed;
  font-weight:600;
}

/* ---------- Layout bits ---------- */
main{ flex:1; padding-bottom:96px; }
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
}
.card + .card{ margin-top:14px; }
.section-title{
  font-size:12.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-muted);
  margin:22px 0 10px;
}
.section-title:first-child{ margin-top:4px; }

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12px; font-weight:500; color:var(--text-muted); }
.input, select.input, textarea.input{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:10px;
  padding:10px 11px;
  font-size:15px;
  outline:none;
}
.input:focus{ border-color:var(--accent); }
textarea.input{ resize:vertical; min-height:44px; }
.field-row{ display:flex; gap:10px; }
.field-row > .field{ flex:1; min-width:0; }

.segmented{
  display:flex;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:3px;
  gap:3px;
}
.segmented button{
  flex:1;
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:13.5px;
  font-weight:600;
  padding:8px 6px;
  border-radius:8px;
  cursor:pointer;
}
.segmented button.active{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:10px;
  padding:11px 16px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
}
.btn.block{ width:100%; }
.btn.accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--blue); padding-inline:6px; }
.btn.danger{ background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad); }
.btn.sm{ padding:7px 11px; font-size:13px; border-radius:8px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; flex:none; }

.fx-preview{
  font-size:12.5px;
  color:var(--text-muted);
  padding:8px 10px;
  background:var(--surface-2);
  border-radius:8px;
}
.fx-preview b{ color:var(--text); }

/* ---------- Expense / hours rows ---------- */
.row-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 2px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.row-item:last-child{ border-bottom:none; }
.row-date{
  flex:none;
  width:42px;
  text-align:center;
}
.row-date .d{ font-size:16px; font-weight:700; line-height:1.1; }
.row-date .m{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.row-mid{ flex:1; min-width:0; }
.row-mid .cat{ font-size:14px; font-weight:600; }
.row-mid .note{ font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-amt{ flex:none; text-align:right; }
.row-amt .a{ font-size:14.5px; font-weight:600; }
.row-amt .c{ font-size:10.5px; color:var(--text-faint); }

.empty-state{
  text-align:center;
  padding:34px 14px;
  color:var(--text-muted);
}
.empty-state .icon{ color:var(--text-faint); margin-bottom:10px; }
.empty-state p{ font-size:13.5px; margin:4px 0 0; }
.empty-state h3{ font-size:15px; color:var(--text); }

/* ---------- Week nav ---------- */
.week-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px;
}
.week-nav .label{ text-align:center; }
.week-nav .label .wk{ font-size:14.5px; font-weight:700; }
.week-nav .label .rng{ font-size:11.5px; color:var(--text-muted); }
.iconbtn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  flex:none;
}
.iconbtn svg{ width:17px;height:17px; }

/* ---------- Pivot table ---------- */
.table-wrap{ overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
table.pivot{
  border-collapse:collapse;
  width:100%;
  min-width:560px;
  font-size:12.5px;
}
table.pivot th, table.pivot td{
  padding:8px 9px;
  text-align:right;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.pivot th{
  background:var(--surface-2);
  font-weight:600;
  color:var(--text-muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
table.pivot td:first-child, table.pivot th:first-child{
  text-align:left;
  position:sticky;
  left:0;
  background:var(--surface);
  font-weight:500;
}
table.pivot th:first-child{ background:var(--surface-2); }
table.pivot tr.total-row td{ font-weight:700; background:var(--surface-2); }
table.pivot tr.total-row td:first-child{ background:var(--surface-3); }
table.pivot td.zero{ color:var(--text-faint); }

/* ---------- Stat tiles ---------- */
.stat-grid{ display:flex; gap:10px; }
.stat-tile{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 14px;
  box-shadow:var(--shadow);
}
.stat-tile .lbl{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.stat-tile .val{ font-size:19px; font-weight:700; margin-top:4px; }
.stat-tile .val.good{ color:var(--good); }
.stat-tile .val.bad{ color:var(--bad); }

/* ---------- Project card (resumen) ---------- */
.proj-card{ margin-top:14px; }
.proj-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.proj-head h3{ font-size:15.5px; }
.proj-head .meta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
.tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  padding:4px 8px; border-radius:999px;
}
.tag.perdiem{ background:var(--blue-soft); color:var(--blue); }
.tag.gastos{ background:var(--accent-soft); color:var(--accent-strong); }
.proj-figures{ display:flex; gap:10px; margin-top:14px; }
.pf{ flex:1; }
.pf .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
.pf .val{ font-size:15px; font-weight:700; margin-top:2px; }
.proj-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }

/* ---------- Bottom nav ---------- */
#bottomnav{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav-inner{
  max-width:520px;
  margin:0 auto;
  display:flex;
  justify-content:space-around;
}
.nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  background:none;
  border:none;
  color:var(--text-faint);
  font-size:10.5px;
  font-weight:600;
  cursor:pointer;
  padding:4px 10px;
  border-radius:10px;
}
.nav-btn svg{ width:22px; height:22px; }
.nav-btn.active{ color:var(--accent); }

/* ---------- Modal ---------- */
#modalRoot:empty{ display:none; }
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(15,17,22,.5);
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background:var(--bg);
  width:100%;
  max-width:520px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.modal-head h2{ font-size:16.5px; }
.modal-close{
  width:30px;height:30px;border-radius:50%;
  border:none; background:var(--surface-2); color:var(--text-muted);
  display:flex;align-items:center;justify-content:center; cursor:pointer;
}
.cat-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:999px; padding:6px 6px 6px 11px; font-size:12.5px; margin:0 6px 6px 0;
}
.cat-chip button{ border:none; background:none; color:var(--text-faint); cursor:pointer; font-size:13px; line-height:1; padding:2px; }
.confirm-row{ display:flex; gap:8px; margin-top:10px; }
.confirm-row .btn{ flex:1; }
.hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; }
.divider{ height:1px; background:var(--border); margin:16px 0; }
.spacer{ height:1px; }
</style>

<div id="app">
  <header id="topbar">
    <div class="brand">

<script>
(function(){
"use strict";

/* ================= Constants ================= */
var PER_DIEM_CATEGORIES = ['Airfare','Baggage','Gas','Hotel','Meals','Rental Car','Taxi / Parking','Tolls','Mileage','Per Diem'];
var GASTOS_CATEGORIES = ['Material eléctrico','Material neumático','Material mecánico','Gasolina','Hotel','Alimentos/Comidas','Viáticos','Taxi/Estacionamiento','Casetas','Comisiones'];
var WEEKDAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var LOCAL_PREFIX = 'viaticosux_v1_';

/* ================= State ================= */
var state = {
  projects: [], expenses: [], hours: [], advances: [],
  loaded: { projects:false, expenses:false, hours:false, advances:false },
  currentTab: 'gastos',
  selectedProjectId: null,
  weekStart: mondayOf(new Date()),
  editing: { expenseId:null, hoursId:null, projectId:null },
  hoursManual: false,
  expenseCurrency: 'MXN',
  hoursPersonFilter: 'all',
  confirmDelete: null /* {type, id} */
};
var PERSON_PALETTE = ['#5B8DEF','#E0A354','#4FB286','#C77DC0','#E2725B','#4FA8C9','#B9A23D'];

var dbCap = null;
var usingLocal = false;

/* ================= Utilities ================= */
function uid(){ return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad2(n){ return (n<10?'0':'')+n; }
function toISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return toISODate(new Date()); }
function parseISODate(s){ var p=s.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function mondayOf(d){
  var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = date.getDay();
  var diff = (day===0? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  return date;
}
function addDays(d, n){ var r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate()+n); return r; }
function isoWeekNumber(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - yearStart) / 86400000) + 1)/7);
}
function shortDate(d){ return pad2(d.getDate())+' '+MONTHS[d.getMonth()]; }
function fmtMoney(n, cur){
  cur = cur || 'MXN';
  var sign = n<0 ? '-' : '';
  var v = Math.abs(n||0);
  var s = v.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
  return sign + (cur==='USD' ? '$' : '$') + s + (cur==='USD' ? ' USD' : '');
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function byId(arr, id){ return arr.filter(function(x){ return x.id===id; })[0] || null; }
function activeProjects(){ return state.projects.filter(function(p){ return !p.archived; }).sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); }); }
function selectedProject(){ return byId(state.projects, state.selectedProjectId); }
/* A project can combine both control styles at once (viaticos/per-diem AND
   gastos costeados) — these read the new independent flags, falling back
   to the old single `type` field for projects created before this. */
function pdEnabled(p){ if(!p) return false; if(p.perDiemEnabled!==undefined) return !!p.perDiemEnabled; return p.type==='per_diem'; }
function gcEnabled(p){ if(!p) return false; if(p.gastosEnabled!==undefined) return !!p.gastosEnabled; return p.type==='gastos'; }
function categoriesFor(project){
  if(project && project.categories && project.categories.length) return project.categories;
  var list = [];
  if(pdEnabled(project)) list = list.concat(PER_DIEM_CATEGORIES);
  if(gcEnabled(project)) list = list.concat(GASTOS_CATEGORIES);
  return list.length ? list : PER_DIEM_CATEGORIES;
}
function peopleFor(project){ return (project && project.people && project.people.length) ? project.people : ['Adiel Palacios']; }
function personColor(project, name){
  var list = peopleFor(project);
  var idx = list.indexOf(name);
  if(idx<0) idx = 0;
  return PERSON_PALETTE[idx % PERSON_PALETTE.length];
}
/* Cross-project palette (no single project's roster to index into) — a
   stable hash of the name picks the color instead. */
function personColorGlobal(name){
  var h = 0;
  for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) | 0; }
  return PERSON_PALETTE[Math.abs(h) % PERSON_PALETTE.length];
}

/* ================= Store (db capability with localStorage fallback) ================= */
function localGet(name){
  try{ return JSON.parse(localStorage.getItem(LOCAL_PREFIX+name) || '[]'); }
  catch(e){ return []; }
}
function localSet(name, arr){
  try{ localStorage.setItem(LOCAL_PREFIX+name, JSON.stringify(arr)); }catch(e){}
}
function onCollectionUpdate(col, arr){
  state[col] = arr;
  state.loaded[col] = true;
  if(!state.selectedProjectId && col==='projects'){
    var act = activeProjects();
    if(act.length) state.selectedProjectId = act[0].id;
  }
  render();
}
function subscribeAll(){
  var cols = ['projects','expenses','hours','advances'];
  if(usingLocal){
    cols.forEach(function(c){ onCollectionUpdate(c, localGet(c)); });
  } else {
    cols.forEach(function(c){
      try{
        dbCap.collection(c).onSnapshot(function(snap){
          var arr = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          onCollectionUpdate(c, arr);
        }, function(err){ console.error('db error', c, err); });
      }catch(e){ console.error(e); onCollectionUpdate(c, localGet(c)); }
    });
  }
}
function addRecord(col, data){
  var body = Object.assign({}, data, { createdAt: new Date().toISOString() });
  if(usingLocal){
    var id = uid();
    var arr = localGet(col);
    arr.push(Object.assign({id:id}, body));
    localSet(col, arr);
    onCollectionUpdate(col, arr);
    return Promise.resolve(id);
  }
  return dbCap.collection(col).add(body).then(function(ref){ return ref.id; });
}
function updateRecord(col, id, data){
  if(usingLocal){
    var arr = localGet(col);
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ idx=i; break; } }
    if(idx>=0){ arr[idx] = Object.assign({}, arr[idx], data); localSet(col, arr); onCollectionUpdate(col, arr); }
    return Promise.resolve();
  }
  return dbCap.collection(col).doc(id).update(data);
}
function deleteRecord(col, id){
  if(usingLocal){
    var arr = localGet(col).filter(function(x){ return x.id!==id; });
    localSet(col, arr);
    onCollectionUpdate(col, arr);
    return Promise.resolve();
  }
  return dbCap.collection(col).doc(id).delete();
}

function initStore(){
  var goLocal = function(){
    usingLocal = true;
    var pill = document.getElementById('syncDot');
    var lbl = document.getElementById('syncLabel');
    if(pill) pill.classList.add('local');
    if(lbl) lbl.textContent = 'Solo en este dispositivo';
    subscribeAll();
  };
  var goSynced = function(cap, label){
    dbCap = cap;
    usingLocal = false;
    var pill = document.getElementById('syncDot');
    var lbl = document.getElementById('syncLabel');
    if(pill) pill.classList.remove('local');
    if(lbl) lbl.textContent = label || 'Sincronizado';
    subscribeAll();
  };
  /* Fuera de Claude: si hay config de Firebase, usarla como base de datos
     compartida en la nube (misma API que la capability db.collection(...),
     así que subscribeAll/addRecord/updateRecord/deleteRecord no cambian). */
  var tryFirebase = function(){
    if(!FIREBASE_CONFIG || typeof firebase==='undefined'){ goLocal(); return; }
    try{
      var app = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      auth.onAuthStateChanged(function(user){
        if(user){ goSynced(firebase.firestore(), 'Sincronizado (Firebase)'); }
      });
      auth.signInAnonymously().catch(function(err){ console.error('firebase auth', err); goLocal(); });
      setTimeout(function(){ if(!state.loaded.projects && !dbCap) goLocal(); }, 6000);
    }catch(e){ console.error('firebase init', e); goLocal(); }
  };
  try{
    if(window.claude && window.claude.use){
      window.claude.use('db').then(function(cap){
        if(cap){ goSynced(cap, 'Sincronizado'); }
        else { goLocal(); }
      }).catch(function(){ goLocal(); });
      setTimeout(function(){ if(!state.loaded.projects && !dbCap) goLocal(); }, 4000);
    } else {
      tryFirebase();
    }
  }catch(e){ goLocal(); }
}

/* ================= CSV export ================= */
function exportProjectCSV(project){
  var rows = state.expenses.filter(function(e){ return e.projectId===project.id; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  var lines = ['Fecha,Categoria,Moneda,Monto,TipoCambio,MontoMXN,Nota'];
  rows.forEach(function(e){
    var note = (e.note||'').replace(/"/g,'""');
    lines.push([e.date, '"'+(e.category||'')+'"', e.currency, e.amount, e.fx||1, (e.mxn||0).toFixed(2), '"'+note+'"'].join(','));
  });
  var csv = lines.join('\n');
  var filename = 'Gastos_'+project.name.replace(/[^a-z0-9]+/gi,'_')+'.csv';
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(dl){
        dl.save({ filename: filename, data: csv }).catch(function(){ fallbackDownload(csv, filename); });
      } else {
        fallbackDownload(csv, filename);
      }
    }).catch(function(){ fallbackDownload(csv, filename); });
  } else {
    fallbackDownload(csv, filename);
  }
}
function fallbackDownload(csv, filename){
  /* Plain-browser download (works when this page runs outside the Claude
     artifact sandbox, e.g. self-hosted) — a real file save via an <a download>. */
  try{
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){
    alertBanner('La exportación no está disponible en esta vista.');
  }
}
var bannerTimeout=null;
function alertBanner(msg){
  var el = document.getElementById('flashBanner');
  if(!el) return;
  el.textContent = msg;
  el.style.display='block';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(function(){ el.style.display='none'; }, 2600);
}

}

/* ================= Tab: Resumen ================= */
function renderResumen(){
  var all = activeProjects();
  var monday = state.weekStart;
  var sunday = addDays(monday,6);
  var wk = isoWeekNumber(monday);
  var weekEntries = state.hours.filter(function(h){ var d=parseISODate(h.date); return d>=monday && d<=sunday; });
  var weekHoursAll = weekEntries.reduce(function(a,h){return a+(h.hours||0);},0);

  var totalSaldo = 0;
  all.forEach(function(p){
    var gastado = state.expenses.filter(function(e){return e.projectId===p.id;}).reduce(function(a,e){return a+(e.mxn||0);},0);
    var abonado = state.advances.filter(function(a){return a.projectId===p.id;}).reduce(function(a,x){return a+(x.amount||0);},0);

  html += '</div>';

    var byPerson = {};

    names.forEach(function(nm){

      html += '<span class="dot" style="background:'+personColorGlobal(nm)+';display:inline-block;"></span>';

      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  all.forEach(function(p){
    var expenses = state.expenses.filter(function(e){return e.projectId===p.id;});
    var gastado = expenses.reduce(function(a,e){return a+(e.mxn||0);},0);
    var advances = state.advances.filter(function(a){return a.projectId===p.id;});
    var abonado = advances.reduce(function(a,x){return a+(x.amount||0);},0);
    var saldo = gastado-abonado;

    if(gcEnabled(p)) html += '<span class="tag gastos">Gastos</span>';
    html += '</div></div>';
    html += '<div class="proj-figures">';
    html += '<div class="pf"><div class="lbl">Gastado</div><div class="val">'+fmtMoney(gastado,'MXN')+'</div></div>';
    html += '<div class="pf"><div class="lbl">Abonado</div><div class="val">'+fmtMoney(abonado,'MXN')+'</div></div>';

/* ================= Event binding ================= */
function computeHours(start, finish){
  var sp = start.split(':'), fp = finish.split(':');
  var sMin = parseInt(sp[0])*60+parseInt(sp[1]);
  var fMin = parseInt(fp[0])*60+parseInt(fp[1]);
  var diff = fMin - sMin;
  if(diff===0) return 0;
  if(diff<0) diff += 24*60;
  return Math.round((diff/60)*100)/100;
}
var TIME24_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function isValidTime24(s){ return typeof s==='string' && TIME24_RE.test(s); }
/* Keeps a 24h time text field numeric-only and auto-inserts the ':' as the
   person types, so entry never depends on the device's AM/PM locale setting. */
function formatTime24Typing(el){
  var digits = el.value.replace(/\D/g,'').slice(0,4);
  if(digits.length>=2){
    var hh = digits.slice(0,2);
    if(parseInt(hh,10)>23) hh='23';
    digits = hh+digits.slice(2);
  }
  el.value = digits.length>2 ? (digits.slice(0,2)+':'+digits.slice(2)) : digits;
}

      list.forEach(function(c){

          span.innerHTML = esc(c)+'<button type="button" data-remove-cat="'+esc(c)+'">✕</button>';
          wrap.appendChild(span);
          existing.push(c);
        }
      });
      bindCatRemovers();
    }
    toggles.querySelectorAll('[data-toggle-type]').forEach(function(b){
      b.addEventListener('click', function(){
        b.classList.toggle('active');

      });
    });
    bindCatRemovers();
    document.getElementById('pjInsertPD').addEventListener('click', function(){ addCatsToForm(PER_DIEM_CATEGORIES); });
    document.getElementById('pjInsertGC').addEventListener('click', function(){ addCatsToForm(GASTOS_CATEGORIES); });
    document.getElementById('pjAddCatBtn').addEventListener('click', function(){
      var input = document.getElementById('pjNewCat');
      var v = input.value.trim();
      if(!v) return;
      addCatsToForm([v]);
      input.value='';
    });
    bindPersonRemovers();
    function addPersonToForm(nm){
      nm = nm.trim();
      if(!nm) return;
      var wrap = document.getElementById('pjPeople');
      var existing = Array.prototype.slice.call(wrap.children).map(function(c){return c.getAttribute('data-person');});
      if(existing.indexOf(nm)!==-1) return;
      var idx = existing.length;
      var span = document.createElement('span');
      span.className='cat-chip'; span.setAttribute('data-person', nm);
      span.innerHTML = '<span class="dot" style="background:'+PERSON_PALETTE[idx%PERSON_PALETTE.length]+';display:inline-block;"></span>'+esc(nm)+'<button type="button" data-remove-person="'+esc(nm)+'">✕</button>';
      wrap.appendChild(span);
      bindPersonRemovers();
    }
    document.getElementById('pjAddPersonBtn').addEventListener('click', function(){
      var input = document.getElementById('pjNewPerson');
      addPersonToForm(input.value);
      input.value='';
    });
    document.getElementById('pjSaveBtn').addEventListener('click', function(){
      var pjName = document.getElementById('pjName').value.trim();
      if(!pjName){ alertBanner('Escribe un nombre para el proyecto.'); return; }
      var pdOn = toggles.querySelector('[data-toggle-type="perdiem"]').classList.contains('active');
      var gcOn = toggles.querySelector('[data-toggle-type="gastos"]').classList.contains('active');
      if(!pdOn && !gcOn){ alertBanner('Activa al menos un tipo de control: viáticos o gastos.'); return; }
      var cats = Array.prototype.slice.call(document.getElementById('pjCategories').children).map(function(c){return c.getAttribute('data-cat');});
      var people = Array.prototype.slice.call(document.getElementById('pjPeople').children).map(function(c){return c.getAttribute('data-person');});
      if(!people.length) people = ['Adiel Palacios'];
      var data = {
        name: pjName,
        client: document.getElementById('pjClient').value.trim(),
        plant: document.getElementById('pjPlant').value.trim(),
        reason: document.getElementById('pjReason').value.trim(),
        perDiemEnabled: pdOn,
        gastosEnabled: gcOn,
        perDiemUSD: parseFloat(document.getElementById('pjPerDiem').value)||50,
        perDiemCurrency: pdSeg.querySelector('button.active').getAttribute('data-pdcur'),
        categories: cats,
        people: people
      };
      if(name==='editProject'){
        updateRecord('projects', opts.project, data);
      } else {
        data.archived = false; data.lastFx = 17.3;
        addRecord('projects', data).then(function(id){ state.selectedProjectId = id; render(); });
      }
      closeModal();
    });
    if(name==='editProject'){
      document.getElementById('pjArchiveBtn').addEventListener('click', function(){
        updateRecord('projects', opts.project, {archived:true}).then(function(){
          if(state.selectedProjectId===opts.project){
            var act = activeProjects();
            state.selectedProjectId = act.length ? act[0].id : null;
          }
          closeModal();
        });
      });
      document.getElementById('pjDeleteBtn').addEventListener('click', function(){
        document.getElementById('pjDeleteConfirm').style.display = '';
        document.getElementById('pjDeleteBtn').style.display = 'none';
      });
      document.getElementById('pjDeleteCancel').addEventListener('click', function(){
        document.getElementById('pjDeleteConfirm').style.display = 'none';
        document.getElementById('pjDeleteBtn').style.display = '';
      });
      document.getElementById('pjDeleteConfirmBtn').addEventListener('click', function(){
        var btn = document.getElementById('pjDeleteConfirmBtn');
        btn.disabled = true; btn.textContent = 'Eliminando…';
        var pid = opts.project;
        var relatedExpenses = state.expenses.filter(function(e){return e.projectId===pid;});
        var relatedHours = state.hours.filter(function(h){return h.projectId===pid;});
        var relatedAdvances = state.advances.filter(function(a){return a.projectId===pid;});
        var jobs = []
          .concat(relatedExpenses.map(function(e){return deleteRecord('expenses', e.id);}))
          .concat(relatedHours.map(function(h){return deleteRecord('hours', h.id);}))
          .concat(relatedAdvances.map(function(a){return deleteRecord('advances', a.id);}));
        Promise.all(jobs).then(function(){ return deleteRecord('projects', pid); }).then(function(){
          if(state.selectedProjectId===pid){
            var act = activeProjects();
            state.selectedProjectId = act.length ? act[0].id : null;
          }
          alertBanner('Proyecto eliminado.');
          closeModal();
        });
      });
    }
  }
  else if(name==='newAdvance'){
    document.getElementById('advSaveBtn').addEventListener('click', function(){
      var amt = parseFloat(document.getElementById('advAmount').value);
      if(!amt || amt<=0){ alertBanner('Ingresa un monto válido.'); return; }
      addRecord('advances', {
        projectId: opts.project,
        date: document.getElementById('advDate').value || todayISO(),
        amount: amt,
        method: document.getElementById('advMethod').value.trim(),
        note: document.getElementById('advNote').value.trim()
      }).then(closeModal);
    });
  }
  else if(name==='viewAdvances'){
    sheet.querySelectorAll('[data-delete-advance]').forEach(function(b){
      b.addEventListener('click', function(){
        deleteRecord('advances', b.getAttribute('data-delete-advance')).then(function(){
          openModal('viewAdvances', opts);
        });
      });
    });
  }
  else if(name==='editExpense'){
    var curSeg = document.getElementById('eeCurSeg');
    curSeg.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        curSeg.querySelectorAll('button').forEach(function(x){x.classList.remove('active');});
        b.classList.add('active');
        document.getElementById('eeFxWrap').style.display = b.getAttribute('data-cur')==='USD' ? '' : 'none';
      });
    });
    document.getElementById('eeSaveBtn').addEventListener('click', function(){
      var id = document.getElementById('eeSaveBtn').getAttribute('data-id');
      var cur = curSeg.querySelector('button.active').getAttribute('data-cur');
      var amount = parseFloat(document.getElementById('eeAmount').value)||0;
      var fx = cur==='USD' ? (parseFloat(document.getElementById('eeFx').value)||1) : 1;
      var mxn = cur==='USD' ? amount*fx : amount;
      updateRecord('expenses', id, {
        date: document.getElementById('eeDate').value,
        category: document.getElementById('eeCategory').value,
        currency: cur, amount: amount, fx: fx, mxn: mxn,
        note: document.getElementById('eeNote').value.trim()
      }).then(closeModal);
    });
    document.getElementById('eeDeleteBtn').addEventListener('click', function(){
      var id = document.getElementById('eeDeleteBtn').getAttribute('data-id');
      deleteRecord('expenses', id).then(closeModal);
    });
  }
  else if(name==='editHours'){
    var toggle = document.getElementById('heManualToggle');
    toggle.addEventListener('change', function(){
      document.getElementById('heScheduleWrap').style.display = toggle.checked ? 'none':'';
      document.getElementById('heManualWrap').style.display = toggle.checked ? '':'none';
    });
    document.getElementById('heSaveBtn').addEventListener('click', function(){
      var id = document.getElementById('heSaveBtn').getAttribute('data-id');
      var manual = toggle.checked;
      var hePersonEl = document.getElementById('hePerson');
      var data = { date: document.getElementById('heDate').value, activity: document.getElementById('heActivity').value.trim() };
      if(hePersonEl) data.person = hePersonEl.value;
      if(manual){
        data.hours = parseFloat(document.getElementById('heManualVal').value)||0;
        data.start = null; data.finish = null;
      } else {
        var s = document.getElementById('heStart').value, f = document.getElementById('heFinish').value;
        if(!isValidTime24(s) || !isValidTime24(f)){ alertBanner('Escribe la hora en formato de 24h, ej. 08:00 o 17:30.'); return; }
        data.start = s; data.finish = f; data.hours = computeHours(s,f);
      }
      updateRecord('hours', id, data).then(closeModal);
    });
    document.getElementById('heDeleteBtn').addEventListener('click', function(){
      var id = document.getElementById('heDeleteBtn').getAttribute('data-id');
      deleteRecord('hours', id).then(closeModal);
    });
  }
}
function bindCatRemovers(){
  document.querySelectorAll('[data-remove-cat]').forEach(function(b){
    b.onclick = function(){ b.parentElement.remove(); };
  });
}
function bindPersonRemovers(){
  document.querySelectorAll('[data-remove-person]').forEach(function(b){
    b.onclick = function(){
      var wrap = document.getElementById('pjPeople');
      if(wrap.children.length<=1){ alertBanner('Debe quedar al menos una persona.'); return; }
      b.parentElement.remove();
      /* re-color remaining chips by their new position */
      Array.prototype.slice.call(wrap.children).forEach(function(chip, i){
        var dot = chip.querySelector('.dot');
        if(dot) dot.style.background = PERSON_PALETTE[i%PERSON_PALETTE.length];
      });
    };
  });
}

/* ================= Global click delegation ================= */
document.addEventListener('click', function(e){
  var t = e.target;

  var tabBtn = t.closest('.nav-btn');
  if(tabBtn){ state.currentTab = tabBtn.getAttribute('data-tab'); render(); return; }

  var chip = t.closest('[data-select-project]');
  if(chip){ state.selectedProjectId = chip.getAttribute('data-select-project'); render(); return; }

  var modalOpener = t.closest('[data-open-modal]');
  if(modalOpener){
    openModal(modalOpener.getAttribute('data-open-modal'), { project: modalOpener.getAttribute('data-project') });
    return;
  }

  var closeBtn = t.closest('[data-close-modal]');
  if(closeBtn){ closeModal(); return; }

  var weekBtn = t.closest('[data-week]');
  if(weekBtn){ state.weekStart = addDays(state.weekStart, parseInt(weekBtn.getAttribute('data-week'))*7); render(); return; }

  var curBtn = t.closest('[data-set-currency]');
  if(curBtn){ state.expenseCurrency = curBtn.getAttribute('data-set-currency'); render(); return; }

  var personFilterBtn = t.closest('[data-person-filter]');
  if(personFilterBtn){ state.hoursPersonFilter = personFilterBtn.getAttribute('data-person-filter'); render(); return; }

  var addPersonToggle = t.closest('#hrsAddPersonToggle');
  if(addPersonToggle){
    var row = document.getElementById('hrsAddPersonRow');
    row.style.display = row.style.display==='none' ? '' : 'none';
    return;
  }
  var addPersonBtn = t.closest('#hrsAddPersonBtn');
  if(addPersonBtn){
    var pr = selectedProject();
    var input = document.getElementById('hrsNewPersonInput');
    var nm = input.value.trim();
    if(!nm || !pr) return;
    var list = peopleFor(pr);
    if(list.indexOf(nm)===-1) list = list.concat([nm]);
    updateRecord('projects', pr.id, {people:list}).then(function(){
      state.hoursPersonFilter = nm;
      alertBanner('Persona agregada.');
      render();
    });
    return;
  }

  var expRow = t.closest('[data-edit-expense]');
  if(expRow){ openModal('editExpense', { expense: expRow.getAttribute('data-edit-expense') }); return; }

  var hrsRow = t.closest('[data-edit-hours]');
  if(hrsRow){ openModal('editHours', { hours: hrsRow.getAttribute('data-edit-hours') }); return; }

  var saveExp = t.closest('#saveExpenseBtn');
  if(saveExp){
    var p = selectedProject();
    if(!p) return;
    var amount = parseFloat(document.getElementById('expAmount').value);
    if(!amount || amount<=0){ alertBanner('Ingresa un monto válido.'); return; }
    var cur = state.expenseCurrency;
    var fx = cur==='USD' ? (parseFloat(document.getElementById('expFx').value)||1) : 1;
    var mxn = cur==='USD' ? amount*fx : amount;
    addRecord('expenses', {
      projectId: p.id,
      date: document.getElementById('expDate').value || todayISO(),
      category: document.getElementById('expCategory').value,
      currency: cur, amount: amount, fx: fx, mxn: mxn,
      note: document.getElementById('expNote').value.trim()
    }).then(function(){
      if(cur==='USD') updateRecord('projects', p.id, {lastFx: fx});
      alertBanner('Gasto guardado.');
      state.expenseCurrency='MXN';
      render();
    });
    return;
  }

  var saveHrs = t.closest('#saveHoursBtn');
  if(saveHrs){
    var p2 = selectedProject();
    if(!p2) return;
    var personEl = document.getElementById('hrsPerson');
    var personVal = personEl ? personEl.value : peopleFor(p2)[0];
    var data = { projectId: p2.id, person: personVal, date: document.getElementById('hrsDate').value || todayISO(), activity: document.getElementById('hrsActivity').value.trim() };
    if(state.hoursManual){
      data.hours = parseFloat(document.getElementById('hrsManualVal').value)||0;
      data.start = null; data.finish = null;
    } else {
      var s = document.getElementById('hrsStart').value, f = document.getElementById('hrsFinish').value;
      if(!isValidTime24(s) || !isValidTime24(f)){ alertBanner('Escribe la hora en formato de 24h, ej. 08:00 o 17:30.'); return; }
      data.start = s; data.finish = f; data.hours = computeHours(s,f);
    }
    addRecord('hours', data).then(function(){ alertBanner('Horas guardadas.'); render(); });
    return;
  }

  var exportBtn = t.closest('[data-export-csv]');
  if(exportBtn){
    var proj = byId(state.projects, exportBtn.getAttribute('data-export-csv'));
    if(proj) exportProjectCSV(proj);
    return;
  }

  var unarchiveBtn = t.closest('[data-unarchive]');
  if(unarchiveBtn){
    updateRecord('projects', unarchiveBtn.getAttribute('data-unarchive'), {archived:false});
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.id==='hrsManualToggle'){ state.hoursManual = e.target.checked; render(); }
});

document.addEventListener('input', function(e){
  if(e.target.id==='expAmount' || e.target.id==='expFx'){
    var amt = parseFloat(document.getElementById('expAmount').value)||0;
    var fxEl = document.getElementById('expFx');
    var fx = fxEl ? (parseFloat(fxEl.value)||0) : 1;
    var preview = document.getElementById('fxPreview');
    if(preview) preview.innerHTML = 'Equivalente: <b>'+ (amt*fx).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}) +' MXN</b>';
  }
  if(e.target.classList && e.target.classList.contains('time24')){
    formatTime24Typing(e.target);
  }
  if(e.target.id==='hrsStart' || e.target.id==='hrsFinish'){
    var s = document.getElementById('hrsStart').value, f = document.getElementById('hrsFinish').value;
    var el = document.getElementById('hrsComputed');
    if(el){ el.textContent = (isValidTime24(s) && isValidTime24(f)) ? 'Horas: '+computeHours(s,f).toFixed(1) : 'Horas: escribe HH:MM (24h) en ambos campos'; }
  }
});

/* ================= Boot ================= */
function boot(){
  render();
  initStore();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}
})();
</script>
