<title>Viáticos UX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F5F6F8;
  --surface:#FFFFFF;
  --surface-2:#EDEFF3;
  --surface-3:#E3E6EC;
  --text:#1A1E27;
  --text-muted:#5C6472;
  --text-faint:#8C93A0;
  --border:#DCE0E6;
  --accent:#C97A22;
  --accent-strong:#A8631A;
  --accent-ink:#FFF7EC;
  --accent-soft:#FBEBD9;
  --blue:#2E5F8A;
  --blue-soft:#E4EDF5;
  --good:#2C8A5B;
  --good-soft:#E2F3E9;
  --bad:#C24B3E;
  --bad-soft:#FBE7E4;
  --shadow: 0 1px 2px rgba(20,24,32,.06), 0 6px 16px -8px rgba(20,24,32,.12);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161B;
    --surface:#1C1F26;
    --surface-2:#242832;
    --surface-3:#2C303C;
    --text:#EAECF0;
    --text-muted:#9BA2B0;
    --text-faint:#6E7583;
    --border:#2E323D;
    --accent:#E0A354;
    --accent-strong:#EDB66C;
    --accent-ink:#231705;
    --accent-soft:#3A2A14;
    --blue:#7FA9CE;
    --blue-soft:#1E2C3A;
    --good:#5FBE8B;
    --good-soft:#173225;
    --bad:#E28174;
    --bad-soft:#3A2019;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14161B;
  --surface:#1C1F26;
  --surface-2:#242832;
  --surface-3:#2C303C;
  --text:#EAECF0;
  --text-muted:#9BA2B0;
  --text-faint:#6E7583;
  --border:#2E323D;
  --accent:#E0A354;
  --accent-strong:#EDB66C;
  --accent-ink:#231705;
  --accent-soft:#3A2A14;
  --blue:#7FA9CE;
  --blue-soft:#1E2C3A;
  --good:#5FBE8B;
  --good-soft:#173225;
  --bad:#E28174;
  --bad-soft:#3A2019;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.5);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}
.num{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
h1,h2,h3{ text-wrap:balance; margin:0; }
button{ font-family:inherit; }
input,select,textarea{ font-family:inherit; }

#app{
  max-width:520px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  padding-inline:16px;
}

/* ---------- Topbar ---------- */
#topbar{
  position:sticky;
  top:env(safe-area-inset-top, 0px);
  z-index:20;
  background:var(--bg);
  padding-block:14px 8px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid transparent;
}
.brand{
  display:flex;
  flex-direction:column;
  gap:2px;
}
.brand .wordmark{
  font-size:18px;
  font-weight:700;
  letter-spacing:-.01em;
}
.brand .wordmark .accent-dot{ color:var(--accent); }
.brand .sub{
  font-size:11.5px;
  color:var(--text-muted);
}
.sync-pill{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--text-muted);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 10px 5px 8px;
  white-space:nowrap;
}
.sync-dot{ width:7px;height:7px;border-radius:50%; background:var(--good); flex:none; }
.sync-dot.local{ background:var(--text-faint); }

/* ---------- Project chips ---------- */
.chips-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-block:6px 12px;
  scrollbar-width:none;
}
.chips-row::-webkit-scrollbar{ display:none; }
.chip{
  flex:none;
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 13px;
  border-radius:999px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
}
.dot{ width:6px;height:6px;border-radius:50%; flex:none; display:inline-block; }
.chip.active{
  border-color:var(--accent);
  background:var(--accent-soft);
  color:var(--text);
}
.chip.add{
  color:var(--accent);
  border-style:dashed;
  font-weight:600;
}

/* ---------- Layout bits ---------- */
main{ flex:1; padding-bottom:96px; }
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
}
.card + .card{ margin-top:14px; }
.section-title{
  font-size:12.5px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--text-muted);
  margin:22px 0 10px;
}
.section-title:first-child{ margin-top:4px; }

.field{ display:flex; flex-direction:column; gap:6px; }
.field label{ font-size:12px; font-weight:500; color:var(--text-muted); }
.input, select.input, textarea.input{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:10px;
  padding:10px 11px;
  font-size:15px;
  outline:none;
}
.input:focus{ border-color:var(--accent); }
textarea.input{ resize:vertical; min-height:44px; }
.field-row{ display:flex; gap:10px; }
.field-row > .field{ flex:1; min-width:0; }

.segmented{
  display:flex;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:3px;
  gap:3px;
}
.segmented button{
  flex:1;
  border:none;
  background:transparent;
  color:var(--text-muted);
  font-size:13.5px;
  font-weight:600;
  padding:8px 6px;
  border-radius:8px;
  cursor:pointer;
}
.segmented button.active{
  background:var(--surface);
  color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border:1px solid var(--border);
  background:var(--surface-2);
  color:var(--text);
  border-radius:10px;
  padding:11px 16px;
  font-size:14.5px;
  font-weight:600;
  cursor:pointer;
}
.btn.block{ width:100%; }
.btn.accent{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--blue); padding-inline:6px; }
.btn.danger{ background:var(--bad-soft); border-color:var(--bad-soft); color:var(--bad); }
.btn.sm{ padding:7px 11px; font-size:13px; border-radius:8px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn svg{ width:15px; height:15px; flex:none; }

.fx-preview{
  font-size:12.5px;
  color:var(--text-muted);
  padding:8px 10px;
  background:var(--surface-2);
  border-radius:8px;
}
.fx-preview b{ color:var(--text); }

/* ---------- Expense / hours rows ---------- */
.row-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 2px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.row-item:last-child{ border-bottom:none; }
.row-date{
  flex:none;
  width:42px;
  text-align:center;
}
.row-date .d{ font-size:16px; font-weight:700; line-height:1.1; }
.row-date .m{ font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.row-mid{ flex:1; min-width:0; }
.row-mid .cat{ font-size:14px; font-weight:600; }
.row-mid .note{ font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-amt{ flex:none; text-align:right; }
.row-amt .a{ font-size:14.5px; font-weight:600; }
.row-amt .c{ font-size:10.5px; color:var(--text-faint); }

.empty-state{
  text-align:center;
  padding:34px 14px;
  color:var(--text-muted);
}
.empty-state .icon{ color:var(--text-faint); margin-bottom:10px; }
.empty-state p{ font-size:13.5px; margin:4px 0 0; }
.empty-state h3{ font-size:15px; color:var(--text); }

/* ---------- Week nav ---------- */
.week-nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:14px;
}
.week-nav .label{ text-align:center; }
.week-nav .label .wk{ font-size:14.5px; font-weight:700; }
.week-nav .label .rng{ font-size:11.5px; color:var(--text-muted); }
.iconbtn{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  cursor:pointer;
  flex:none;
}
.iconbtn svg{ width:17px;height:17px; }

/* ---------- Pivot table ---------- */
.table-wrap{ overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
table.pivot{
  border-collapse:collapse;
  width:100%;
  min-width:560px;
  font-size:12.5px;
}
table.pivot th, table.pivot td{
  padding:8px 9px;
  text-align:right;
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.pivot th{
  background:var(--surface-2);
  font-weight:600;
  color:var(--text-muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.03em;
}
table.pivot td:first-child, table.pivot th:first-child{
  text-align:left;
  position:sticky;
  left:0;
  background:var(--surface);
  font-weight:500;
}
table.pivot th:first-child{ background:var(--surface-2); }
table.pivot tr.total-row td{ font-weight:700; background:var(--surface-2); }
table.pivot tr.total-row td:first-child{ background:var(--surface-3); }
table.pivot td.zero{ color:var(--text-faint); }

/* ---------- Stat tiles ---------- */
.stat-grid{ display:flex; gap:10px; }
.stat-tile{
  flex:1;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 14px;
  box-shadow:var(--shadow);
}
.stat-tile .lbl{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; }
.stat-tile .val{ font-size:19px; font-weight:700; margin-top:4px; }
.stat-tile .val.good{ color:var(--good); }
.stat-tile .val.bad{ color:var(--bad); }

/* ---------- Project card (resumen) ---------- */
.proj-card{ margin-top:14px; }
.proj-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.proj-head h3{ font-size:15.5px; }
.proj-head .meta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
.tag{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  padding:4px 8px; border-radius:999px;
}
.tag.perdiem{ background:var(--blue-soft); color:var(--blue); }
.tag.gastos{ background:var(--accent-soft); color:var(--accent-strong); }
.proj-figures{ display:flex; gap:10px; margin-top:14px; }
.pf{ flex:1; }
.pf .lbl{ font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; }
.pf .val{ font-size:15px; font-weight:700; margin-top:2px; }
.proj-actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }

/* ---------- Bottom nav ---------- */
#bottomnav{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:30;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
}
.nav-inner{
  max-width:520px;
  margin:0 auto;
  display:flex;
  justify-content:space-around;
}
.nav-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  background:none;
  border:none;
  color:var(--text-faint);
  font-size:10.5px;
  font-weight:600;
  cursor:pointer;
  padding:4px 10px;
  border-radius:10px;
}
.nav-btn svg{ width:22px; height:22px; }
.nav-btn.active{ color:var(--accent); }

/* ---------- Modal ---------- */
#modalRoot:empty{ display:none; }
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(15,17,22,.5);
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-sheet{
  background:var(--bg);
  width:100%;
  max-width:520px;
  max-height:88vh;
  overflow-y:auto;
  border-radius:18px 18px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.25);
}
.modal-head{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.modal-head h2{ font-size:16.5px; }
.modal-close{
  width:30px;height:30px;border-radius:50%;
  border:none; background:var(--surface-2); color:var(--text-muted);
  display:flex;align-items:center;justify-content:center; cursor:pointer;
}
.cat-chip{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:999px; padding:6px 6px 6px 11px; font-size:12.5px; margin:0 6px 6px 0;
}
.cat-chip button{ border:none; background:none; color:var(--text-faint); cursor:pointer; font-size:13px; line-height:1; padding:2px; }
.confirm-row{ display:flex; gap:8px; margin-top:10px; }
.confirm-row .btn{ flex:1; }
.hint{ font-size:11.5px; color:var(--text-faint); margin-top:6px; }
.divider{ height:1px; background:var(--border); margin:16px 0; }
.spacer{ height:1px; }
</style>

<script>
(function(){
"use strict";

/* ================= Constants ================= */
/* Los conceptos que viáticos y gastos costeados comparten (hotel, gasolina,
   casetas, comidas, taxi/estacionamiento, el per diem en sí) usan aquí el
   mismo nombre en las dos listas, para que un proyecto con ambos estilos
   activados no muestre la misma categoría dos veces. Solo lo exclusivo de
   cada estilo queda separado (Airfare/Baggage/Rental Car/Mileage por un
   lado, Material eléctrico/neumático/mecánico y Comisiones por el otro). */
var PER_DIEM_CATEGORIES = ['Airfare','Baggage','Gasolina','Hotel','Alimentos/Comidas','Rental Car','Taxi / Estacionamiento','Casetas','Mileage','Viáticos'];
var GASTOS_CATEGORIES = ['Material eléctrico','Material neumático','Material mecánico','Gasolina','Hotel','Alimentos/Comidas','Viáticos','Taxi / Estacionamiento','Casetas','Comisiones'];
/* Nombres antiguos que ya pudieran estar guardados en gastos o proyectos
   creados antes de esta unificación, mapeados a su nombre unificado actual. */
var CATEGORY_ALIASES = {
  'Gas':'Gasolina',
  'Taxi / Parking':'Taxi / Estacionamiento',
  'Taxi/Estacionamiento':'Taxi / Estacionamiento',
  'Tolls':'Casetas',
  'Meals':'Alimentos/Comidas',
  'Per Diem':'Viáticos'
};
function canonicalCategory(c){ return CATEGORY_ALIASES[c] || c; }
function uniqueList(arr){
  var seen = {}, out = [];
  arr.forEach(function(c){ if(!seen[c]){ seen[c]=true; out.push(c); } });
  return out;
}
var WEEKDAYS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
var MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var LOCAL_PREFIX = 'viaticosux_v1_';

/* ================= State ================= */
var state = {
  projects: [], expenses: [], hours: [], advances: [],
  loaded: { projects:false, expenses:false, hours:false, advances:false },
  currentTab: 'gastos',
  selectedProjectId: null,
  weekStart: mondayOf(new Date()),
  editing: { expenseId:null, hoursId:null, projectId:null },
  hoursManual: false,
  expenseCurrency: 'MXN',
  hoursPersonFilter: 'all',
  confirmDelete: null /* {type, id} */
};
var PERSON_PALETTE = ['#5B8DEF','#E0A354','#4FB286','#C77DC0','#E2725B','#4FA8C9','#B9A23D'];

var dbCap = null;
var usingLocal = false;
var pendingExpensePhoto = null; /* dataURL de la foto elegida para el próximo gasto a guardar */

/* ================= Utilities ================= */
function uid(){ return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad2(n){ return (n<10?'0':'')+n; }
function toISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function todayISO(){ return toISODate(new Date()); }
function parseISODate(s){ var p=s.split('-'); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
function mondayOf(d){
  var date = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = date.getDay();
  var diff = (day===0? -6 : 1-day);
  date.setDate(date.getDate()+diff);
  return date;
}
function addDays(d, n){ var r = new Date(d.getFullYear(), d.getMonth(), d.getDate()); r.setDate(r.getDate()+n); return r; }
function isoWeekNumber(d){
  var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  var dayNum = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil((((t - yearStart) / 86400000) + 1)/7);
}
function shortDate(d){ return pad2(d.getDate())+' '+MONTHS[d.getMonth()]; }
function fmtMoney(n, cur){
  cur = cur || 'MXN';
  var sign = n<0 ? '-' : '';
  var v = Math.abs(n||0);
  var s = v.toLocaleString('es-MX', {minimumFractionDigits:2, maximumFractionDigits:2});
  return sign + (cur==='USD' ? '$' : '$') + s + (cur==='USD' ? ' USD' : '');
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* Comprime una foto (ticket/nota sin factura) a un data URL JPEG que quepa
   cómodamente dentro del límite de 1 MB por documento de Firestore/db. Baja
   resolución y calidad en pasos hasta que el resultado sea razonablemente
   chico; si ni así cabe, rechaza para que la UI avise en vez de guardar
   algo que luego falle al sincronizar. */
function compressImageFile(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read_failed')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode_failed')); };
      img.onload = function(){
        /* Márgenes más estrictos que antes: una foto tomada directamente con
           la cámara del celular (varios MB) pasaba la compresión pero el
           documento completo (foto + demás campos) quedaba tan pegado al
           límite de 1 MB de Firestore que el guardado fallaba en silencio.
           Bajamos el objetivo y el tope máximo para dejar margen real. */
        var steps = [[1400,0.72],[1200,0.55],[1000,0.42],[800,0.32],[650,0.25],[500,0.2],[380,0.18]];
        var dataUrl = null;
        for(var i=0;i<steps.length;i++){
          var maxDim = steps[i][0], quality = steps[i][1];
          var scale = Math.min(1, maxDim/Math.max(img.width, img.height));
          var cw = Math.max(1, Math.round(img.width*scale)), ch = Math.max(1, Math.round(img.height*scale));
          var canvas = document.createElement('canvas');
          canvas.width = cw; canvas.height = ch;
          canvas.getContext('2d').drawImage(img, 0, 0, cw, ch);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          if(dataUrl.length <= 480000) break;
        }
        if(!dataUrl || dataUrl.length > 700000){ reject(new Error('too_large')); return; }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function byId(arr, id){ return arr.filter(function(x){ return x.id===id; })[0] || null; }
function activeProjects(){ return state.projects.filter(function(p){ return !p.archived; }).sort(function(a,b){ return (a.createdAt||'').localeCompare(b.createdAt||''); }); }
function selectedProject(){ return byId(state.projects, state.selectedProjectId); }
/* A project can combine both control styles at once (viaticos/per-diem AND
   gastos costeados) — these read the new independent flags, falling back
   to the old single `type` field for projects created before this. */
function pdEnabled(p){ if(!p) return false; if(p.perDiemEnabled!==undefined) return !!p.perDiemEnabled; return p.type==='per_diem'; }
function gcEnabled(p){ if(!p) return false; if(p.gastosEnabled!==undefined) return !!p.gastosEnabled; return p.type==='gastos'; }
function categoriesFor(project){
  /* canonicalCategory + uniqueList también limpian listas guardadas antes de
     la unificación (ej. un proyecto con "Gas" y "Gasolina" ya guardadas por
     separado), sin tener que migrar los datos existentes. */
  if(project && project.categories && project.categories.length){
    return uniqueList(project.categories.map(canonicalCategory));
  }
  var list = [];
  if(pdEnabled(project)) list = list.concat(PER_DIEM_CATEGORIES);
  if(gcEnabled(project)) list = list.concat(GASTOS_CATEGORIES);
  list = uniqueList(list.map(canonicalCategory));
  return list.length ? list : PER_DIEM_CATEGORIES;
}
function peopleFor(project){ return (project && project.people && project.people.length) ? project.people : ['Adiel Palacios']; }
function personColor(project, name){
  var list = peopleFor(project);
  var idx = list.indexOf(name);
  if(idx<0) idx = 0;
  return PERSON_PALETTE[idx % PERSON_PALETTE.length];
}
/* Cross-project palette (no single project's roster to index into) — a
   stable hash of the name picks the color instead. */
function personColorGlobal(name){
  var h = 0;
  for(var i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) | 0; }
  return PERSON_PALETTE[Math.abs(h) % PERSON_PALETTE.length];
}

/* ================= Store (db capability with localStorage fallback) ================= */
function localGet(name){
  try{ return JSON.parse(localStorage.getItem(LOCAL_PREFIX+name) || '[]'); }
  catch(e){ return []; }
}
function localSet(name, arr){
  try{ localStorage.setItem(LOCAL_PREFIX+name, JSON.stringify(arr)); }catch(e){}
}
function onCollectionUpdate(col, arr){
  state[col] = arr;
  state.loaded[col] = true;
  if(!state.selectedProjectId && col==='projects'){
    var act = activeProjects();
    if(act.length) state.selectedProjectId = act[0].id;
  }
  render();
}
function subscribeAll(){
  var cols = ['projects','expenses','hours','advances'];
  if(usingLocal){
    cols.forEach(function(c){ onCollectionUpdate(c, localGet(c)); });
  } else {
    cols.forEach(function(c){
      try{
        dbCap.collection(c).onSnapshot(function(snap){
          var arr = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          onCollectionUpdate(c, arr);
        }, function(err){ console.error('db error', c, err); });
      }catch(e){ console.error(e); onCollectionUpdate(c, localGet(c)); }
    });
  }
}
function addRecord(col, data){
  var body = Object.assign({}, data, { createdAt: new Date().toISOString() });
  if(usingLocal){
    var id = uid();
    var arr = localGet(col);
    arr.push(Object.assign({id:id}, body));
    localSet(col, arr);
    onCollectionUpdate(col, arr);
    return Promise.resolve(id);
  }
  return dbCap.collection(col).add(body).then(function(ref){ return ref.id; });
}
function updateRecord(col, id, data){
  if(usingLocal){
    var arr = localGet(col);
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id===id){ idx=i; break; } }
    if(idx>=0){ arr[idx] = Object.assign({}, arr[idx], data); localSet(col, arr); onCollectionUpdate(col, arr); }
    return Promise.resolve();
  }
  return dbCap.collection(col).doc(id).update(data);
}
function deleteRecord(col, id){
  if(usingLocal){
    var arr = localGet(col).filter(function(x){ return x.id!==id; });
    localSet(col, arr);
    onCollectionUpdate(col, arr);
    return Promise.resolve();
  }
  return dbCap.collection(col).doc(id).delete();
}

function initStore(){
  var goLocal = function(){
    usingLocal = true;
    var pill = document.getElementById('syncDot');
    var lbl = document.getElementById('syncLabel');
    if(pill) pill.classList.add('local');
    if(lbl) lbl.textContent = 'Solo en este dispositivo';
    subscribeAll();
  };
  var goSynced = function(cap, label){
    dbCap = cap;
    usingLocal = false;
    var pill = document.getElementById('syncDot');
    var lbl = document.getElementById('syncLabel');
    if(pill) pill.classList.remove('local');
    if(lbl) lbl.textContent = label || 'Sincronizado';
    subscribeAll();
  };
  /* Fuera de Claude: si hay config de Firebase, usarla como base de datos
     compartida en la nube (misma API que la capability db.collection(...),
     así que subscribeAll/addRecord/updateRecord/deleteRecord no cambian). */
  var tryFirebase = function(){
    if(!FIREBASE_CONFIG || typeof firebase==='undefined'){ goLocal(); return; }
    try{
      var app = firebase.apps && firebase.apps.length ? firebase.apps[0] : firebase.initializeApp(FIREBASE_CONFIG);
      var auth = firebase.auth();
      auth.onAuthStateChanged(function(user){
        if(user){ goSynced(firebase.firestore(), 'Sincronizado (Firebase)'); }
      });
      auth.signInAnonymously().catch(function(err){ console.error('firebase auth', err); goLocal(); });
      setTimeout(function(){ if(!state.loaded.projects && !dbCap) goLocal(); }, 6000);
    }catch(e){ console.error('firebase init', e); goLocal(); }
  };
  try{
    if(window.claude && window.claude.use){
      window.claude.use('db').then(function(cap){
        if(cap){ goSynced(cap, 'Sincronizado'); }
        else { goLocal(); }
      }).catch(function(){ goLocal(); });
      setTimeout(function(){ if(!state.loaded.projects && !dbCap) goLocal(); }, 4000);
    } else {
      tryFirebase();
    }
  }catch(e){ goLocal(); }
}

/* ================= CSV export ================= */
function exportProjectCSV(project){
  var rows = state.expenses.filter(function(e){ return e.projectId===project.id; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  var lines = ['Fecha,Categoria,Moneda,Monto,TipoCambio,MontoMXN,Nota,TieneFoto'];
  rows.forEach(function(e){
    var note = (e.note||'').replace(/"/g,'""');
    lines.push([e.date, '"'+(e.category||'')+'"', e.currency, e.amount, e.fx||1, (e.mxn||0).toFixed(2), '"'+note+'"', e.photo?'Si':'No'].join(','));
  });
  var csv = lines.join('\n');
  var filename = 'Gastos_'+project.name.replace(/[^a-z0-9]+/gi,'_')+'.csv';
  if(window.claude && window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(dl){
        dl.save({ filename: filename, data: csv }).catch(function(){ fallbackDownload(csv, filename); });
      } else {
        fallbackDownload(csv, filename);
      }
    }).catch(function(){ fallbackDownload(csv, filename); });
  } else {
    fallbackDownload(csv, filename);
  }
}
function fallbackDownload(csv, filename){
  /* Plain-browser download (works when this page runs outside the Claude
     artifact sandbox, e.g. self-hosted) — a real file save via an <a download>. */
  try{
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){
    alertBanner('La exportación no está disponible en esta vista.');
  }
}
function downloadBlobFile(blob, filename){
  try{
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){
    alertBanner('La exportación no está disponible en esta vista.');
  }
}

/* ================= Excel export: acumulado de horas ================= */
/* Paleta tomada de los reportes originales de UX Automation/Vibratsa:
   banner naranja arriba, barras de sección en azul marino, encabezados
   de columna también en azul marino con texto blanco. */
var XLS_ORANGE = 'FFDD7A34';
var XLS_NAVY = 'FF1F3864';
var XLS_TOTAL_TINT = 'FFFBE7D6';
/* Encabezado de 5 filas compartido por ambas hojas: banner naranja con el
   proyecto, línea de datos del proyecto, espacio, y la barra de sección en
   azul marino — deja la hoja lista para que la fila 6 sea la de encabezados
   de columna (que cada hoja arma con su propio set de columnas). Solo se
   da estilo a la celda maestra de cada fila combinada: en un merge, Excel
   pinta toda el área usando el estilo de esa celda. */
function addSheetHeader(ws, numCols, project, sectionTitle){
  var row1 = ws.addRow(['UX AUTOMATION — '+(project.client||project.name).toUpperCase()]);
  ws.mergeCells(1,1,1,numCols);
  row1.height = 22;
  var c1 = row1.getCell(1);
  c1.font = { bold:true, size:14, color:{argb:'FFFFFFFF'} };
  c1.alignment = { horizontal:'center', vertical:'middle' };
  c1.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_ORANGE} };

  var metaBits = ['Nombre: Adiel Palacios', 'Proyecto: '+project.name];
  if(project.plant) metaBits.push('Planta: '+project.plant);
  var row2 = ws.addRow([metaBits.join('   ·   ')]);
  ws.mergeCells(2,1,2,numCols);
  var c2 = row2.getCell(1);
  c2.font = { bold:true, size:10.5 };
  c2.alignment = { horizontal:'left', vertical:'middle' };

  ws.addRow([]);

  var row4 = ws.addRow([sectionTitle]);
  ws.mergeCells(4,1,4,numCols);
  row4.height = 20;
  var c4 = row4.getCell(1);
  c4.font = { bold:true, size:12, color:{argb:'FFFFFFFF'} };
  c4.alignment = { horizontal:'center', vertical:'middle' };
  c4.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_NAVY} };

  ws.addRow([]);
}
function styleColumnHeaderRow(row, numCols){
  row.font = { bold:true, color:{argb:'FFFFFFFF'} };
  row.alignment = { vertical:'middle', horizontal:'center' };
  for(var i=1;i<=numCols;i++){ row.getCell(i).fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_NAVY} }; }
}
/* Barra de sección azul marino a mitad de hoja (misma idea que la fila 4 de
   addSheetHeader, pero reutilizable para separar bloques dentro de una
   misma hoja, como en "Main": RESUMEN DE GASTOS / ABONOS RECIBIDOS / SALDO). */
function addSectionBar(ws, numCols, title){
  var row = ws.addRow([title]);
  ws.mergeCells(row.number, 1, row.number, numCols);
  row.height = 20;
  var c = row.getCell(1);
  c.font = { bold:true, size:12, color:{argb:'FFFFFFFF'} };
  c.alignment = { horizontal:'center', vertical:'middle' };
  c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_NAVY} };
  return row;
}
function exportHoursXLSX(project){
  if(typeof ExcelJS==='undefined'){ alertBanner('No se pudo cargar el generador de Excel (revisa tu conexión).'); return; }
  var entries = state.hours.filter(function(h){ return h.projectId===project.id; });
  if(!entries.length){ alertBanner('Este proyecto no tiene horas registradas.'); return; }
  var people = peopleFor(project);

  /* Agrupa por semana ISO (lunes a domingo), igual que el resto de la app. */
  var weeks = {};
  entries.forEach(function(h){
    var d = parseISODate(h.date);
    var mon = mondayOf(d);
    var key = toISODate(mon);
    if(!weeks[key]) weeks[key] = { monday: mon, sunday: addDays(mon,6), weekNum: isoWeekNumber(mon), entries: [] };
    weeks[key].entries.push(h);
  });
  var weekKeys = Object.keys(weeks).sort();
  var sortEntries = function(arr){
    return arr.slice().sort(function(a,b){
      return a.date===b.date ? (a.start||'').localeCompare(b.start||'') : a.date.localeCompare(b.date);
    });
  };

  var wb = new ExcelJS.Workbook();
  wb.creator = 'Viáticos UX';
  wb.created = new Date();

  /* ---- Hoja 1: Detalle día por día, con subtotal al cierre de cada semana ---- */
  var det = wb.addWorksheet('Detalle');
  var detCols = [
    { key:'week', width:9 }, { key:'day', width:10 }, { key:'date', width:13 },
    { key:'person', width:20 }, { key:'start', width:10 }, { key:'finish', width:12 },
    { key:'hours', width:9 }, { key:'activity', width:32 }
  ];
  det.columns = detCols;
  addSheetHeader(det, detCols.length, project, 'DETALLE DE HORAS POR SEMANA');
  var detHeaderRow = det.addRow({ week:'Semana', day:'Día', date:'Fecha', person:'Persona', start:'Entrada', finish:'Salida', hours:'Horas', activity:'Actividad' });
  styleColumnHeaderRow(detHeaderRow, detCols.length);

  weekKeys.forEach(function(key){
    var wk = weeks[key];
    var rows = sortEntries(wk.entries);
    rows.forEach(function(h){
      var d = parseISODate(h.date);
      var dayName = WEEKDAYS[(d.getDay()+6)%7];
      var row = det.addRow({
        week: wk.weekNum, day: dayName, date: h.date,
        person: h.person || people[0],
        start: h.start || '', finish: h.finish || 'Manual',
        hours: h.hours || 0, activity: h.activity || ''
      });
      row.getCell('hours').numFmt = '0.0';
    });
    var total = rows.reduce(function(a,h){ return a+(h.hours||0); }, 0);
    var totalRow = det.addRow({ finish:'Total semana '+wk.weekNum+':', hours: total });
    totalRow.font = { bold:true };
    totalRow.getCell('hours').numFmt = '0.0';
    totalRow.eachCell({ includeEmpty:true }, function(cell){
      cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} };
      cell.border = { top:{style:'thin', color:{argb:'FFAAAAAA'}} };
    });
  });
  det.views = [{ state:'frozen', ySplit:6 }];

  /* ---- Hoja 2: Resumen semanal, con el total por persona y el total general ---- */
  var sum = wb.addWorksheet('Resumen semanal');
  var sumCols = [ { key:'week', width:9 }, { key:'from', width:13 }, { key:'to', width:13 } ];
  people.forEach(function(nm){ sumCols.push({ key:'p_'+nm, width:16 }); });
  sumCols.push({ key:'total', width:14 });

  var sumHeaderData = { week:'Semana', from:'Del', to:'Al', total:'Total semana' };
  people.forEach(function(nm){ sumHeaderData['p_'+nm] = nm; });
  var sumHeaderRow = sum.addRow(sumHeaderData);
  styleColumnHeaderRow(sumHeaderRow, sumCols.length);

  var grandTotal = 0, grandByPerson = {};
  people.forEach(function(nm){ grandByPerson[nm] = 0; });
  weekKeys.forEach(function(key){
    var wk = weeks[key];
    var rowData = { week: wk.weekNum, from: toISODate(wk.monday), to: toISODate(wk.sunday) };
    var weekTotal = 0;
    people.forEach(function(nm){
      var t = wk.entries.filter(function(h){ return (h.person||people[0])===nm; }).reduce(function(a,h){return a+(h.hours||0);},0);
      rowData['p_'+nm] = t;
      weekTotal += t;
      grandByPerson[nm] += t;
    });
    rowData.total = weekTotal;
    grandTotal += weekTotal;
    var r = sum.addRow(rowData);
    people.forEach(function(nm){ r.getCell('p_'+nm).numFmt = '0.0'; });
    r.getCell('total').numFmt = '0.0';
    r.getCell('total').font = { bold:true };
  });
  var grandData = { from:'', to:'TOTAL GENERAL', total: grandTotal };
  people.forEach(function(nm){ grandData['p_'+nm] = grandByPerson[nm]; });
  var grandRow = sum.addRow(grandData);
  grandRow.font = { bold:true };
  grandRow.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} }; });
  people.forEach(function(nm){ grandRow.getCell('p_'+nm).numFmt = '0.0'; });
  grandRow.getCell('total').numFmt = '0.0';
  sum.views = [{ state:'frozen', ySplit:6 }];

  wb.xlsx.writeBuffer().then(function(buffer){
    var blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var filename = 'Horas_'+project.name.replace(/[^a-z0-9]+/gi,'_')+'.xlsx';
    downloadBlobFile(blob, filename);
  }).catch(function(err){ console.error(err); alertBanner('No se pudo generar el archivo de Excel.'); });
}

/* ================= Excel export: gastos (con fotos de tickets) ================= */
/* Lee las dimensiones naturales de una imagen a partir de su data URL, para
   poder dimensionar proporcionalmente cada foto antes de insertarla en la
   hoja de Excel (ExcelJS necesita el ancho/alto en el momento de llamar a
   worksheet.addImage, así que esto se resuelve todo por adelantado con
   Promise.all antes de construir el libro de forma síncrona). */
function getImageDims(dataUrl){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      img.onload = function(){ resolve({ w: img.naturalWidth||400, h: img.naturalHeight||300 }); };
      img.onerror = function(){ resolve({ w:400, h:300 }); };
      img.src = dataUrl;
    }catch(e){ resolve({ w:400, h:300 }); }
  });
}
function exportGastosXLSX(project){
  if(typeof ExcelJS==='undefined'){ alertBanner('No se pudo cargar el generador de Excel (revisa tu conexión).'); return; }
  var rows = state.expenses.filter(function(e){ return e.projectId===project.id; })
    .sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(!rows.length){ alertBanner('Este proyecto no tiene gastos registrados.'); return; }

  /* Agrupa por semana ISO, igual que Detalle de horas, para el subtotal. */
  var weeks = {};
  rows.forEach(function(e){
    var d = parseISODate(e.date);
    var mon = mondayOf(d);
    var key = toISODate(mon);
    if(!weeks[key]) weeks[key] = { monday: mon, sunday: addDays(mon,6), weekNum: isoWeekNumber(mon), entries: [] };
    weeks[key].entries.push(e);
  });
  var weekKeys = Object.keys(weeks).sort();

  var withPhoto = rows.filter(function(e){ return !!e.photo; });

  /* Resuelve las dimensiones de todas las fotos ANTES de construir el
     workbook, porque ExcelJS no es asíncrono: no se pueden intercalar
     llamadas await entre addRow/addImage sin arriesgar el orden de filas. */
  Promise.all(withPhoto.map(function(e){ return getImageDims(e.photo); })).then(function(dimsList){
    var wb = new ExcelJS.Workbook();
    wb.creator = 'Viáticos UX';
    wb.created = new Date();

    /* ---- Hoja "Main": resumen de gastos por semana + abonos recibidos +
       saldo pendiente, igual que la hoja principal de tu archivo actual.
       Se deja como primera pestaña. Los totales usan fórmulas reales de
       Excel (no solo el valor calculado), para que si luego editas algo a
       mano el saldo se recalcule solo. ---- */
    var main = wb.addWorksheet('Main');
    var mainCols = [ { key:'a', width:24 }, { key:'b', width:17 }, { key:'c', width:19 }, { key:'d', width:24 } ];
    main.columns = mainCols;
    addSheetHeader(main, mainCols.length, project, 'CONTROL DE ABONOS DE GASTOS COSTEADOS');

    var gHeaderRow = main.addRow({ a:'Semana', b:'Periodo', c:'Total Gastado', d:'Hoja de referencia' });
    styleColumnHeaderRow(gHeaderRow, mainCols.length);
    var firstGastoDataRow = gHeaderRow.number + 1;
    weekKeys.forEach(function(key){
      var wk = weeks[key];
      var totalMXN = wk.entries.reduce(function(a,e){ return a+(e.mxn||0); }, 0);
      var r = main.addRow({ a:'Semana '+wk.weekNum, b: shortDate(wk.monday)+' al '+shortDate(wk.sunday), c: totalMXN, d:'Detalle de gastos' });
      r.getCell('c').numFmt = '#,##0.00';
    });
    var lastGastoDataRow = main.rowCount;
    var gastoTotalRow = main.addRow({ b:'TOTAL GASTADO ACUMULADO', c:{ formula: 'SUM(C'+firstGastoDataRow+':C'+lastGastoDataRow+')' } });
    gastoTotalRow.font = { bold:true };
    gastoTotalRow.getCell('c').numFmt = '#,##0.00';
    gastoTotalRow.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} }; });
    var gastoTotalCellAddr = 'C'+gastoTotalRow.number;

    main.addRow([]);
    addSectionBar(main, mainCols.length, 'ABONOS RECIBIDOS');
    var advancesList = state.advances.filter(function(a){ return a.projectId===project.id; }).sort(function(a,b){ return a.date.localeCompare(b.date); });
    var aHeaderRow = main.addRow({ a:'Fecha', b:'Monto', c:'Método / Referencia', d:'Nota' });
    styleColumnHeaderRow(aHeaderRow, mainCols.length);
    var firstAbonoDataRow = aHeaderRow.number + 1;
    if(advancesList.length){
      advancesList.forEach(function(a){
        var r = main.addRow({ a:a.date, b:a.amount||0, c:a.method||'', d:a.note||'' });
        r.getCell('b').numFmt = '#,##0.00';
      });
    } else {
      main.addRow({ a:'Sin abonos registrados todavía.' });
    }
    var lastAbonoDataRow = main.rowCount;
    var abonoTotalRow = main.addRow({ a:'TOTAL ABONADO', b: advancesList.length ? { formula: 'SUM(B'+firstAbonoDataRow+':B'+lastAbonoDataRow+')' } : 0 });
    abonoTotalRow.font = { bold:true };
    abonoTotalRow.getCell('b').numFmt = '#,##0.00';
    abonoTotalRow.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} }; });
    var abonoTotalCellAddr = 'B'+abonoTotalRow.number;

    main.addRow([]);
    addSectionBar(main, mainCols.length, 'SALDO');
    var saldoR1 = main.addRow({ a:'Total Gastado Acumulado', b:{ formula: gastoTotalCellAddr } });
    saldoR1.getCell('b').numFmt = '#,##0.00';
    var saldoR2 = main.addRow({ a:'Total Abonado', b:{ formula: abonoTotalCellAddr } });
    saldoR2.getCell('b').numFmt = '#,##0.00';
    var saldoRow = main.addRow({ a:'SALDO PENDIENTE POR COBRAR', b:{ formula: 'B'+saldoR1.number+'-B'+saldoR2.number } });
    saldoRow.font = { bold:true, size:12, color:{argb:'FFFFFFFF'} };
    saldoRow.getCell('b').numFmt = '#,##0.00';
    saldoRow.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_ORANGE} }; cell.font = { bold:true, color:{argb:'FFFFFFFF'} }; });
    main.views = [{ state:'frozen', ySplit:6 }];

    /* ---- Hoja 1: Detalle de gastos, con subtotal al cierre de cada semana ---- */
    var det = wb.addWorksheet('Detalle de gastos');
    var detCols = [
      { key:'week', width:9 }, { key:'day', width:10 }, { key:'date', width:13 },
      { key:'category', width:22 }, { key:'currency', width:9 }, { key:'amount', width:12 },
      { key:'fx', width:9 }, { key:'mxn', width:13 }, { key:'note', width:30 }, { key:'photo', width:10 }
    ];
    det.columns = detCols;
    addSheetHeader(det, detCols.length, project, 'DETALLE DE GASTOS POR SEMANA');
    var detHeaderRow = det.addRow({ week:'Semana', day:'Día', date:'Fecha', category:'Categoría', currency:'Moneda', amount:'Monto', fx:'T/C', mxn:'Monto MXN', note:'Nota', photo:'Foto' });
    styleColumnHeaderRow(detHeaderRow, detCols.length);

    var grandTotalMXN = 0;
    weekKeys.forEach(function(key){
      var wk = weeks[key];
      var list = wk.entries.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
      list.forEach(function(e){
        var d = parseISODate(e.date);
        var dayName = WEEKDAYS[(d.getDay()+6)%7];
        var row = det.addRow({
          week: wk.weekNum, day: dayName, date: e.date,
          category: e.category||'', currency: e.currency||'MXN',
          amount: e.amount||0, fx: e.fx||1, mxn: e.mxn||0,
          note: e.note||'', photo: e.photo ? 'Ver hoja Fotos' : ''
        });
        row.getCell('amount').numFmt = '#,##0.00';
        row.getCell('mxn').numFmt = '#,##0.00';
        if(e.photo) row.getCell('photo').font = { italic:true, color:{argb:'FF1F3864'} };
      });
      var totalMXN = list.reduce(function(a,e){ return a+(e.mxn||0); }, 0);
      grandTotalMXN += totalMXN;
      var totalRow = det.addRow({ note:'Total semana '+wk.weekNum+':', mxn: totalMXN });
      totalRow.font = { bold:true };
      totalRow.getCell('mxn').numFmt = '#,##0.00';
      totalRow.eachCell({ includeEmpty:true }, function(cell){
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} };
        cell.border = { top:{style:'thin', color:{argb:'FFAAAAAA'}} };
      });
    });
    var grandRowDet = det.addRow({ note:'TOTAL GENERAL:', mxn: grandTotalMXN });
    grandRowDet.font = { bold:true };
    grandRowDet.getCell('mxn').numFmt = '#,##0.00';
    grandRowDet.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} }; });
    det.views = [{ state:'frozen', ySplit:6 }];

    /* ---- Hoja 2: Resumen semanal ---- */
    var sum = wb.addWorksheet('Resumen semanal');
    var sumCols = [ { key:'week', width:9 }, { key:'from', width:13 }, { key:'to', width:13 }, { key:'total', width:16 } ];
    sum.columns = sumCols;
    addSheetHeader(sum, sumCols.length, project, 'RESUMEN SEMANAL DE GASTOS');
    var sumHeaderRow = sum.addRow({ week:'Semana', from:'Del', to:'Al', total:'Total MXN' });
    styleColumnHeaderRow(sumHeaderRow, sumCols.length);
    weekKeys.forEach(function(key){
      var wk = weeks[key];
      var totalMXN = wk.entries.reduce(function(a,e){ return a+(e.mxn||0); }, 0);
      var r = sum.addRow({ week: wk.weekNum, from: toISODate(wk.monday), to: toISODate(wk.sunday), total: totalMXN });
      r.getCell('total').numFmt = '#,##0.00';
      r.getCell('total').font = { bold:true };
    });
    var grandRowSum = sum.addRow({ to:'TOTAL GENERAL', total: grandTotalMXN });
    grandRowSum.font = { bold:true };
    grandRowSum.getCell('total').numFmt = '#,##0.00';
    grandRowSum.eachCell({ includeEmpty:true }, function(cell){ cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:XLS_TOTAL_TINT} }; });
    sum.views = [{ state:'frozen', ySplit:6 }];

    /* ---- Hoja 3: Fotos de tickets/notas, una debajo de otra con su ficha ---- */
    if(withPhoto.length){
      var pic = wb.addWorksheet('Fotos');
      pic.columns = [ { key:'a', width:80 } ];
      addSheetHeader(pic, 1, project, 'TICKETS Y NOTAS (SIN FACTURA)');
      var picHeaderRow = pic.addRow({ a:'Comprobante' });
      styleColumnHeaderRow(picHeaderRow, 1);

      var sortedPhotoIdx = withPhoto.map(function(e,i){ return i; })
        .sort(function(i,j){ return withPhoto[i].date.localeCompare(withPhoto[j].date); });

      sortedPhotoIdx.forEach(function(i){
        var e = withPhoto[i];
        var dims = dimsList[i];
        /* Ficha de texto: fecha, categoría, monto, nota. */
        var caption = e.date+'   ·   '+(e.category||'')+'   ·   '+
          (e.amount||0)+' '+(e.currency||'MXN')+(e.fx&&e.fx!==1 ? ' (T/C '+e.fx+', '+(e.mxn||0).toFixed(2)+' MXN)' : '') +
          (e.note ? '   ·   '+e.note : '');
        var capRow = pic.addRow({ a: caption });
        capRow.font = { bold:true, size:10.5 };
        capRow.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FFF2F2F2'} };

        /* Escala la imagen a un ancho fijo manteniendo proporción, para que
           quepa cómoda en la columna sin distorsionarse. */
        var targetW = 480;
        var scale = targetW / (dims.w||400);
        var targetH = Math.round((dims.h||300) * scale);
        var m = /^data:image\/(\w+);base64,/.exec(e.photo||'');
        var ext = (m && m[1]==='jpeg') ? 'jpeg' : (m ? m[1] : 'jpeg');
        if(ext!=='png' && ext!=='jpeg' && ext!=='gif') ext = 'jpeg';
        var imgId = wb.addImage({ base64: e.photo, extension: ext });
        var imgRowIndex = pic.rowCount; /* fila justo debajo de la ficha, 0-based para addImage */
        /* 20px es la altura real de fila por default en Excel (15pt); se
           deja solo 1 fila de colchón (no 2) para que quede un respiro
           visible sin dejar tanto espacio en blanco de más. */
        var rowsForImage = Math.max(2, Math.ceil(targetH/20)) + 1;
        for(var r=0;r<rowsForImage;r++) pic.addRow([]);
        pic.addImage(imgId, { tl:{ col:0.1, row: imgRowIndex + 0.1 }, ext:{ width: targetW, height: targetH } });
        pic.addRow([]); /* espacio entre comprobantes */
      });
      pic.views = [{ state:'frozen', ySplit:6 }];
    }

    wb.xlsx.writeBuffer().then(function(buffer){
      var blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var filename = 'Gastos_'+project.name.replace(/[^a-z0-9]+/gi,'_')+'.xlsx';
      downloadBlobFile(blob, filename);
    }).catch(function(err){ console.error(err); alertBanner('No se pudo generar el archivo de Excel.'); });
  }).catch(function(err){ console.error(err); alertBanner('No se pudo generar el archivo de Excel.'); });
}

var bannerTimeout=null;
function alertBanner(msg){
  var el = document.getElementById('flashBanner');
  if(!el) return;
  el.textContent = msg;
  el.style.display='block';
  clearTimeout(bannerTimeout);
  bannerTimeout = setTimeout(function(){ el.style.display='none'; }, 2600);
}

/* ================= Rendering: shell ================= */
function render(){
  renderSyncPill();
  renderChips();
  renderContent();
  renderNav();
}
function renderSyncPill(){
  var dot = document.getElementById('syncDot');
  var lbl = document.getElementById('syncLabel');
  if(!dot||!lbl) return;
  var allLoaded = state.loaded.projects && state.loaded.expenses && state.loaded.hours && state.loaded.advances;
  if(!allLoaded){ lbl.textContent='Cargando…'; return; }
  lbl.textContent = usingLocal ? 'Solo en este dispositivo' : 'Sincronizado';
  dot.classList.toggle('local', usingLocal);
}
function renderNav(){
  var btns = document.querySelectorAll('.nav-btn');
  btns.forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')===state.currentTab); });
}
function renderChips(){
  var wrap = document.getElementById('projectChips');
  var act = activeProjects();
  var html = '';
  act.forEach(function(p){
    var active = p.id===state.selectedProjectId;
    html += '<div class="chip'+(active?' active':'')+'" data-select-project="'+p.id+'">'+
      '<span class="dot" style="background:'+(gcEnabled(p)&&!pdEnabled(p)?'var(--accent)':(pdEnabled(p)&&!gcEnabled(p)?'var(--blue)':'linear-gradient(90deg,var(--blue),var(--accent))'))+'"></span>'+
      esc(p.name)+'</div>';
  });
  html += '<div class="chip add" data-open-modal="newProject">+ Nuevo proyecto</div>';
  wrap.innerHTML = html;
}
function renderContent(){
  var el = document.getElementById('content');
  var body = '<div id="flashBanner" style="display:none;background:var(--surface-3);color:var(--text);font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:12px;text-align:center;"></div>';

  if(!state.loaded.projects){
    body += emptyState('loading', 'Cargando tu bitácora…', 'Un momento.');
    el.innerHTML = body; return;
  }
  if(activeProjects().length===0){
    body += renderOnboarding();
    el.innerHTML = body;
    return;
  }

  if(state.currentTab==='gastos') body += renderGastos();
  else if(state.currentTab==='semana') body += renderSemana();
  else if(state.currentTab==='horas') body += renderHoras();
  else if(state.currentTab==='resumen') body += renderResumen();

  el.innerHTML = body;
}

    '<h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p></div>';
}

function renderOnboarding(){
  return '<div class="card" style="text-align:center;padding:28px 18px;">'+
    '<h3 style="font-size:17px;">Registra tus viáticos y gastos desde el celular</h3>'+
    '<p style="font-size:13.5px;color:var(--text-muted);margin-top:8px;line-height:1.5;">Crea tu primer proyecto para empezar a capturar gastos, horas y abonos, igual que en tus reportes de Excel — pero desde tu iPhone, en el momento en que ocurre el gasto.</p>'+
    '<button class="btn accent block" style="margin-top:16px;" data-open-modal="newProject">Crear primer proyecto</button>'+

/* ================= Tab: Semana ================= */
function renderSemana(){
  var p = selectedProject();
  if(!p) return emptyState('none','Selecciona un proyecto','Elige un proyecto arriba para ver su semana.');
  var cats = categoriesFor(p);
  var monday = state.weekStart;
  var days = [0,1,2,3,4,5,6].map(function(i){ return addDays(monday, i); });
  var wk = isoWeekNumber(monday);

  var weekExpenses = state.expenses.filter(function(e){
    if(e.projectId!==p.id) return false;
    var d = parseISODate(e.date);
    return d >= monday && d <= days[6];
  });

  var html = '<div class="week-nav">';
  html += '<button class="iconbtn" data-week="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>';
  html += '<div class="label"><div class="wk">Semana '+wk+'</div><div class="rng">'+shortDate(monday)+' – '+shortDate(days[6])+'</div></div>';
  html += '<button class="iconbtn" data-week="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>';
  html += '</div>';

  html += '<div class="table-wrap"><table class="pivot"><thead><tr><th>Categoría</th>';
  days.forEach(function(d){ html += '<th>'+WEEKDAYS[days.indexOf(d)]+' '+pad2(d.getDate())+'</th>'; });
  html += '<th>Total</th></tr></thead><tbody>';

  var dayTotals = [0,0,0,0,0,0,0];
  var grand = 0;
  cats.forEach(function(cat){
    var rowTotal = 0;
    var cells = days.map(function(d, i){
      var iso = toISODate(d);
      var sum = weekExpenses.filter(function(e){ return canonicalCategory(e.category)===cat && e.date===iso; })
        .reduce(function(a,e){ return a + (e.mxn||0); }, 0);
      dayTotals[i]+=sum; rowTotal+=sum;
      return sum;
    });
    if(rowTotal===0 && weekExpenses.filter(function(e){return canonicalCategory(e.category)===cat;}).length===0){
      // still show row, but muted
    }
    grand += rowTotal;
    html += '<tr><td>'+esc(cat)+'</td>';
    cells.forEach(function(v){ html += '<td class="num'+(v===0?' zero':'')+'">'+(v===0?'—':v.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0}))+'</td>'; });
    html += '<td class="num">'+(rowTotal===0?'—':rowTotal.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0}))+'</td></tr>';
  });
  html += '<tr class="total-row"><td>Total MXN / día</td>';
  dayTotals.forEach(function(v){ html += '<td class="num">'+v.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0})+'</td>'; });
  html += '<td class="num">'+grand.toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:0})+'</td></tr>';
  html += '</tbody></table></div>';

  var usdSum = weekExpenses.filter(function(e){ return e.currency==='USD'; }).reduce(function(a,e){ return a+e.amount; }, 0);
  html += '<div class="stat-grid" style="margin-top:12px;">';
  html += '<div class="stat-tile"><div class="lbl">Total semana</div><div class="val">'+fmtMoney(grand,'MXN')+'</div></div>';
  if(usdSum>0){
    html += '<div class="stat-tile"><div class="lbl">Origen en USD</div><div class="val">'+fmtMoney(usdSum,'USD')+'</div></div>';
  }
  html += '</div>';
  return html;
}

/* ================= Tab: Horas ================= */

  html += '<div id="hrsAddPersonRow" style="display:none;margin-top:8px;" class="field-row"><input class="input" type="text" id="hrsNewPersonInput" placeholder="Nombre" style="flex:1;"><button class="btn sm" type="button" id="hrsAddPersonBtn">Añadir</button></div>';

    html += '<button class="btn sm ghost" type="button" data-open-modal="copyHours" data-project="'+p.id+'" style="margin-top:8px;">Copiar horas entre personas</button>';
    html += '<button class="btn sm ghost" type="button" data-open-modal="removePerson" data-project="'+p.id+'" style="margin-top:6px;">Quitar una persona del proyecto</button>';
  }
  html += '</div>';

  var weekTotal = weekHours.reduce(function(a,h){ return a+(h.hours||0); }, 0);
  html += '<div class="stat-grid" style="margin-top:14px;">';
  html += '<div class="stat-tile"><div class="lbl">Horas de la semana · '+(state.hoursPersonFilter==='all'?esc(p.name):esc(state.hoursPersonFilter))+'</div><div class="val">'+weekTotal.toFixed(1)+' h</div></div>';

  if(people.length>1 && state.hoursPersonFilter==='all'){

    });
    html += '</div>';
  }

  html += '<div class="section-title">Detalle de la semana</div>';
  var sorted = weekHours.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  if(sorted.length===0){
    html += '<div class="card">'+emptyState('empty','Sin horas registradas','Añade tu primer registro con el formulario de arriba.')+'</div>';
  } else {
    html += '<div class="card" style="padding:4px 14px;">';
    sorted.forEach(function(h){
      var d = parseISODate(h.date);
      var schedule = h.start && h.finish ? (h.start+' – '+h.finish) : 'Manual';
      var personName = h.person || people[0];
      html += '<div class="row-item" data-edit-hours="'+h.id+'">';
      html += '<div class="row-date"><div class="d">'+pad2(d.getDate())+'</div><div class="m">'+MONTHS[d.getMonth()]+'</div></div>';
      html += '<div class="row-mid"><div class="cat">'+schedule+(people.length>1?' <span class="dot" style="background:'+personColor(p,personName)+';display:inline-block;margin-left:4px;"></span> <span style="font-weight:500;color:var(--text-muted);font-size:12px;">'+esc(personName)+'</span>':'')+'</div>'+(h.activity?'<div class="note">'+esc(h.activity)+'</div>':'')+'</div>';
      html += '<div class="row-amt"><div class="a">'+(h.hours||0).toFixed(1)+' h</div></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

/* ================= Tab: Resumen ================= */
function renderResumen(){
  var all = activeProjects();
  var monday = state.weekStart;
  var sunday = addDays(monday,6);
  var wk = isoWeekNumber(monday);
  var weekEntries = state.hours.filter(function(h){ var d=parseISODate(h.date); return d>=monday && d<=sunday; });
  var weekHoursAll = weekEntries.reduce(function(a,h){return a+(h.hours||0);},0);

  var totalSaldo = 0;
  all.forEach(function(p){
    var gastado = state.expenses.filter(function(e){return e.projectId===p.id;}).reduce(function(a,e){return a+(e.mxn||0);},0);
    var abonado = state.advances.filter(function(a){return a.projectId===p.id;}).reduce(function(a,x){return a+(x.amount||0);},0);
    totalSaldo += (gastado-abonado);
  });

  var html = '<div class="stat-grid">';
  html += '<div class="stat-tile"><div class="lbl">Saldo total pendiente</div><div class="val '+(totalSaldo>0?'bad':'good')+'">'+fmtMoney(Math.abs(totalSaldo),'MXN')+'</div></div>';
  html += '<div class="stat-tile"><div class="lbl">Horas esta semana</div><div class="val">'+weekHoursAll.toFixed(1)+' h</div></div>';
  html += '</div>';

  html += '<div class="section-title">Horas por persona</div>';
  html += '<div class="card">';
  html += '<div class="week-nav" style="margin-bottom:'+(weekEntries.length?'10px':'0')+';">';
  html += '<button class="iconbtn" data-week="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>';
  html += '<div class="label"><div class="wk">Semana '+wk+'</div><div class="rng">'+shortDate(monday)+' – '+shortDate(sunday)+'</div></div>';
  html += '<button class="iconbtn" data-week="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>';
  html += '</div>';
  if(!weekEntries.length){
    html += '<div class="hint">Nadie tiene horas registradas esta semana.</div>';
  } else {
    var byPerson = {};
    weekEntries.forEach(function(h){
      var nm = h.person || 'Adiel Palacios';
      byPerson[nm] = (byPerson[nm]||0) + (h.hours||0);
    });
    var names = Object.keys(byPerson).sort(function(a,b){ return byPerson[b]-byPerson[a]; });
    html += '<div style="display:flex;flex-direction:column;gap:8px;">';
    names.forEach(function(nm){
      html += '<div style="display:flex;align-items:center;gap:8px;">';
      html += '<span class="dot" style="background:'+personColorGlobal(nm)+';display:inline-block;"></span>';
      html += '<span style="flex:1;font-size:13.5px;">'+esc(nm)+'</span>';
      html += '<span class="num" style="font-weight:600;">'+byPerson[nm].toFixed(1)+' h</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  all.forEach(function(p){
    var expenses = state.expenses.filter(function(e){return e.projectId===p.id;});
    var gastado = expenses.reduce(function(a,e){return a+(e.mxn||0);},0);
    var advances = state.advances.filter(function(a){return a.projectId===p.id;});
    var abonado = advances.reduce(function(a,x){return a+(x.amount||0);},0);
    var saldo = gastado-abonado;
    html += '<div class="card proj-card">';
    html += '<div class="proj-head"><div><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(p.client||'')+(p.plant?' · '+esc(p.plant):'')+'</div></div>';
    html += '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;">';
    if(pdEnabled(p)) html += '<span class="tag perdiem">Per diem</span>';
    if(gcEnabled(p)) html += '<span class="tag gastos">Gastos</span>';
    html += '</div></div>';
    html += '<div class="proj-figures">';
    html += '<div class="pf"><div class="lbl">Gastado</div><div class="val">'+fmtMoney(gastado,'MXN')+'</div></div>';
    html += '<div class="pf"><div class="lbl">Abonado</div><div class="val">'+fmtMoney(abonado,'MXN')+'</div></div>';
    html += '<div class="pf"><div class="lbl">Saldo</div><div class="val" style="color:'+(saldo>0?'var(--bad)':'var(--good)')+'">'+fmtMoney(Math.abs(saldo),'MXN')+(saldo<0?' a favor':'')+'</div></div>';
    html += '</div>';
    html += '<div class="proj-actions">';
    html += '<button class="btn sm accent" data-open-modal="newAdvance" data-project="'+p.id+'">+ Abono</button>';
    html += '<button class="btn sm" data-open-modal="viewAdvances" data-project="'+p.id+'">Ver abonos ('+advances.length+')</button>';
    html += '<button class="btn sm" data-open-modal="editProject" data-project="'+p.id+'">Editar</button>';
    html += '<button class="btn sm" data-export-csv="'+p.id+'">Exportar CSV</button>';
    html += '<button class="btn sm" data-export-gastos-xlsx="'+p.id+'">Exportar gastos (Excel)</button>';
    html += '<button class="btn sm" data-export-hours="'+p.id+'">Exportar horas (Excel)</button>';
    html += '</div></div>';
  });

  html += '<button class="btn block" style="margin-top:16px;" data-open-modal="newProject">+ Nuevo proyecto</button>';

  var archived = state.projects.filter(function(p){return p.archived;});
  if(archived.length){
    html += '<div class="section-title">Proyectos archivados</div>';
    archived.forEach(function(p){
      html += '<div class="card" style="display:flex;align-items:center;justify-content:space-between;">';
      html += '<div><div style="font-weight:600;font-size:14px;">'+esc(p.name)+'</div><div class="meta" style="font-size:12px;color:var(--text-muted);">'+esc(p.client||'')+'</div></div>';
      html += '<button class="btn sm" data-unarchive="'+p.id+'">Reactivar</button></div>';
    });
  }
  return html;
}

/* ================= Modals ================= */
function openModal(name, opts){
  opts = opts || {};
  var root = document.getElementById('modalRoot');
  var html = '';
  if(name==='newProject') html = modalProjectForm(null);
  else if(name==='editProject') html = modalProjectForm(byId(state.projects, opts.project));
  else if(name==='newAdvance') html = modalAdvanceForm(opts.project);
  else if(name==='viewAdvances') html = modalViewAdvances(opts.project);
  else if(name==='editExpense') html = modalExpenseForm(byId(state.expenses, opts.expense));
  else if(name==='editHours') html = modalHoursForm(byId(state.hours, opts.hours));
  else if(name==='copyHours') html = modalCopyHoursForm(byId(state.projects, opts.project));
  else if(name==='removePerson') html = modalRemovePersonForm(byId(state.projects, opts.project));
  root.innerHTML = '<div class="modal-overlay" id="modalOverlay"><div class="modal-sheet" id="modalSheet"></div></div>';
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target === this) closeModal();
  });
  bindModalEvents(name, opts);
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  state.confirmDelete = null;
}

function computeHours(start, finish){
  var sp = start.split(':'), fp = finish.split(':');
  var sMin = parseInt(sp[0])*60+parseInt(sp[1]);
  var fMin = parseInt(fp[0])*60+parseInt(fp[1]);
  var diff = fMin - sMin;
  if(diff===0) return 0;
  if(diff<0) diff += 24*60;
  return Math.round((diff/60)*100)/100;
}
var TIME24_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
function isValidTime24(s){ return typeof s==='string' && TIME24_RE.test(s); }
/* Keeps a 24h time text field numeric-only and auto-inserts the ':' as the
   person types, so entry never depends on the device's AM/PM locale setting. */
function formatTime24Typing(el){
  var digits = el.value.replace(/\D/g,'').slice(0,4);
  if(digits.length>=2){
    var hh = digits.slice(0,2);
    if(parseInt(hh,10)>23) hh='23';
    digits = hh+digits.slice(2);
  }
  el.value = digits.length>2 ? (digits.slice(0,2)+':'+digits.slice(2)) : digits;
}

  var modalOpener = t.closest('[data-open-modal]');
  if(modalOpener){
    openModal(modalOpener.getAttribute('data-open-modal'), { project: modalOpener.getAttribute('data-project') });
    return;
  }

  var closeBtn = t.closest('[data-close-modal]');
  if(closeBtn){ closeModal(); return; }

  var weekBtn = t.closest('[data-week]');
  if(weekBtn){ state.weekStart = addDays(state.weekStart, parseInt(weekBtn.getAttribute('data-week'))*7); render(); return; }

  var curBtn = t.closest('[data-set-currency]');
  if(curBtn){ state.expenseCurrency = curBtn.getAttribute('data-set-currency'); render(); return; }

  var personFilterBtn = t.closest('[data-person-filter]');
  if(personFilterBtn){ state.hoursPersonFilter = personFilterBtn.getAttribute('data-person-filter'); render(); return; }

  var addPersonToggle = t.closest('#hrsAddPersonToggle');
  if(addPersonToggle){
    var row = document.getElementById('hrsAddPersonRow');
    row.style.display = row.style.display==='none' ? '' : 'none';
    return;
  }
  var addPersonBtn = t.closest('#hrsAddPersonBtn');
  if(addPersonBtn){
    var pr = selectedProject();
    var input = document.getElementById('hrsNewPersonInput');
    var nm = input.value.trim();
    if(!nm || !pr) return;
    var list = peopleFor(pr);
    if(list.indexOf(nm)===-1) list = list.concat([nm]);
    updateRecord('projects', pr.id, {people:list}).then(function(){
      state.hoursPersonFilter = nm;
      alertBanner('Persona agregada.');
      render();
    });
    return;
  }

  var expRow = t.closest('[data-edit-expense]');
  if(expRow){ openModal('editExpense', { expense: expRow.getAttribute('data-edit-expense') }); return; }

  var hrsRow = t.closest('[data-edit-hours]');
  if(hrsRow){ openModal('editHours', { hours: hrsRow.getAttribute('data-edit-hours') }); return; }

  var expPhotoClear = t.closest('#expPhotoClearBtn');
  if(expPhotoClear){
    pendingExpensePhoto = null;
    var wrap = document.getElementById('expPhotoPreviewWrap');
    if(wrap) wrap.style.display = 'none';
    var input = document.getElementById('expPhotoInput');
    if(input) input.value = '';
    return;
  }

  var saveExp = t.closest('#saveExpenseBtn');
  if(saveExp){
    if(saveExp.disabled) return; /* evita duplicar el gasto si se da doble clic */
    var p = selectedProject();
    if(!p) return;
    var amount = parseFloat(document.getElementById('expAmount').value);
    if(!amount || amount<=0){ alertBanner('Ingresa un monto válido.'); return; }
    var cur = state.expenseCurrency;
    var fx = cur==='USD' ? (parseFloat(document.getElementById('expFx').value)||1) : 1;
    var mxn = cur==='USD' ? amount*fx : amount;
    saveExp.disabled = true;
    var saveExpOrigText = saveExp.textContent;
    saveExp.textContent = 'Guardando…';
    addRecord('expenses', {
      projectId: p.id,
      date: document.getElementById('expDate').value || todayISO(),
      category: document.getElementById('expCategory').value,
      currency: cur, amount: amount, fx: fx, mxn: mxn,
      note: document.getElementById('expNote').value.trim(),
      photo: pendingExpensePhoto
    }).then(function(){
      if(cur==='USD') updateRecord('projects', p.id, {lastFx: fx});
      alertBanner('Gasto guardado.');
      state.expenseCurrency='MXN';
      pendingExpensePhoto = null;
      render();
    }).catch(function(err){
      /* Antes esto fallaba en silencio (sin .catch), sobre todo cuando la
         foto adjunta dejaba el documento demasiado cerca del límite de 1 MB
         de Firestore: la promesa se rechazaba y el botón no hacía nada
         visible. Ahora siempre se avisa, y si la foto es la sospechosa se
         sugiere quitarla y volver a intentar. */
      console.error(err);
      var msg = pendingExpensePhoto
        ? 'No se pudo guardar el gasto (posiblemente por la foto adjunta). Intenta quitar la foto y guardar de nuevo, o tómala con menor resolución.'
        : 'No se pudo guardar el gasto. Intenta de nuevo.';
      alertBanner(msg);
      saveExp.disabled = false;
      saveExp.textContent = saveExpOrigText;
    });
    return;
  }

  var saveHrs = t.closest('#saveHoursBtn');
  if(saveHrs){
    var p2 = selectedProject();
    if(!p2) return;
    var personEl = document.getElementById('hrsPerson');
    var personVal = personEl ? personEl.value : peopleFor(p2)[0];
    var data = { projectId: p2.id, person: personVal, date: document.getElementById('hrsDate').value || todayISO(), activity: document.getElementById('hrsActivity').value.trim() };
    if(state.hoursManual){
      data.hours = parseFloat(document.getElementById('hrsManualVal').value)||0;
      data.start = null; data.finish = null;
    } else {
      var s = document.getElementById('hrsStart').value, f = document.getElementById('hrsFinish').value;
      if(!isValidTime24(s) || !isValidTime24(f)){ alertBanner('Escribe la hora en formato de 24h, ej. 08:00 o 17:30.'); return; }
      data.start = s; data.finish = f; data.hours = computeHours(s,f);
    }
    addRecord('hours', data).then(function(){ alertBanner('Horas guardadas.'); render(); });
    return;
  }

  var exportHrsBtn = t.closest('[data-export-hours]');
  if(exportHrsBtn){
    var projH = byId(state.projects, exportHrsBtn.getAttribute('data-export-hours'));
    if(projH) exportHoursXLSX(projH);
    return;
  }

  var exportBtn = t.closest('[data-export-csv]');
  if(exportBtn){
    var proj = byId(state.projects, exportBtn.getAttribute('data-export-csv'));
    if(proj) exportProjectCSV(proj);
    return;
  }

  var exportGastosXlsxBtn = t.closest('[data-export-gastos-xlsx]');
  if(exportGastosXlsxBtn){
    var projG = byId(state.projects, exportGastosXlsxBtn.getAttribute('data-export-gastos-xlsx'));
    if(projG) exportGastosXLSX(projG);
    return;
  }

  var unarchiveBtn = t.closest('[data-unarchive]');
  if(unarchiveBtn){
    updateRecord('projects', unarchiveBtn.getAttribute('data-unarchive'), {archived:false});
    return;
  }
});

document.addEventListener('change', function(e){
  if(e.target.id==='hrsManualToggle'){ state.hoursManual = e.target.checked; render(); }
  if(e.target.id==='expPhotoInput'){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var hint = document.getElementById('expPhotoHint');
    if(hint) hint.textContent = 'Procesando foto…';
    compressImageFile(file).then(function(dataUrl){
      pendingExpensePhoto = dataUrl;
      var wrap = document.getElementById('expPhotoPreviewWrap');
      var img = document.getElementById('expPhotoPreview');
      if(img) img.src = dataUrl;
      if(wrap) wrap.style.display = '';
      if(hint) hint.textContent = '';
    }).catch(function(){
      if(hint) hint.textContent = 'No se pudo procesar esa foto (muy grande o formato no soportado); intenta con otra o tómala con menor resolución.';
    });
  }
});

document.addEventListener('input', function(e){
  if(e.target.id==='expAmount' || e.target.id==='expFx'){
    var amt = parseFloat(document.getElementById('expAmount').value)||0;
    var fxEl = document.getElementById('expFx');
    var fx = fxEl ? (parseFloat(fxEl.value)||0) : 1;
    var preview = document.getElementById('fxPreview');
    if(preview) preview.innerHTML = 'Equivalente: <b>'+ (amt*fx).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}) +' MXN</b>';
  }
  if(e.target.classList && e.target.classList.contains('time24')){
    formatTime24Typing(e.target);
  }
  if(e.target.id==='hrsStart' || e.target.id==='hrsFinish'){
    var s = document.getElementById('hrsStart').value, f = document.getElementById('hrsFinish').value;
    var el = document.getElementById('hrsComputed');
    if(el){ el.textContent = (isValidTime24(s) && isValidTime24(f)) ? 'Horas: '+computeHours(s,f).toFixed(1) : 'Horas: escribe HH:MM (24h) en ambos campos'; }
  }
});

/* ================= Boot ================= */
function boot(){
  render();
  initStore();
}
if(window.claude && window.claude.hot){
  window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
} else {
  boot();
}
})();
</script>
